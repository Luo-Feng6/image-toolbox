function renderPalette() {
  let src = null;
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="plupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传图片</div><div class="dh">📥 松开即可上传</div><input type="file" id="plinput" accept="image/*" hidden></div>
        <div class="sect"><h3>参数</h3><div class="sect-body">
          <div class="slider"><div class="slid-l"><span>颜色数量</span><span id="plnv">6</span></div><input type="range" id="pln" min="3" max="12" value="6" oninput="_raf(window._plExtract)"></div>
        </div></div>
        <div class="sect collapsed" id="plResult" style="display:none"><h3>配色方案</h3><div class="sect-body" id="plSwatches"></div></div>
        <div class="btns" id="plBtns" style="display:none">
          <button class="btn btn2" onclick="window._plCopyCSS()">📋 复制 CSS</button>
          <button class="btn btn2" onclick="window._plDownSwatch()">💾 下载色板</button>
        </div>
      </div>
      <div class="tool-r">
        <div class="prev" id="plprev" style="padding:0;overflow:hidden;background:var(--inp)"><canvas id="plPrevCanvas" style="max-width:100%;display:none"></canvas><div class="pe" id="plpe">等待上传…</div></div>
      </div>
    </div>`;

  setupCollapse('v-tool');
  setupDrop('plupload', 'plinput', async f => { src = await loadImg(f); showUpload('plupload', src.dataUrl); const pvC = $('plPrevCanvas'); const s = Math.min(1, 300 / src.img.height); pvC.width = src.img.width * s; pvC.height = src.img.height * s; pvC.style.display = 'block'; $('plpe').style.display = 'none'; pvC.getContext('2d').drawImage(src.img, 0, 0, pvC.width, pvC.height); window._plHighlighted = null; _plExtract(); });

  function medianCut(pixels, n) {
    let buckets = [pixels.slice()];
    while (buckets.length < n) {
      let maxR = 0, maxI = 0, maxCh = 'r';
      for (let i = 0; i < buckets.length; i++) {
        const b = buckets[i];
        if (b.length < 2) continue;
        let rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0;
        for (const p of b) {
          if (p.r < rMin) rMin = p.r; if (p.r > rMax) rMax = p.r;
          if (p.g < gMin) gMin = p.g; if (p.g > gMax) gMax = p.g;
          if (p.b < bMin) bMin = p.b; if (p.b > bMax) bMax = p.b;
        }
        const rr = rMax - rMin, gr = gMax - gMin, br = bMax - bMin;
        const m = Math.max(rr, gr, br);
        if (m > maxR) { maxR = m; maxI = i; maxCh = rr >= gr && rr >= br ? 'r' : (gr >= br ? 'g' : 'b'); }
      }
      if (maxR === 0) break;
      const b = buckets[maxI];
      b.sort((a, b) => a[maxCh] - b[maxCh]);
      const mid = Math.floor(b.length / 2);
      buckets.splice(maxI, 1, b.slice(0, mid), b.slice(mid));
    }
    return buckets.map(b => {
      const s = b.reduce((a, p) => { a.r += p.r; a.g += p.g; a.b += p.b; return a; }, { r: 0, g: 0, b: 0 });
      return { r: Math.round(s.r / b.length), g: Math.round(s.g / b.length), b: Math.round(s.b / b.length) };
    });
  }

  window._plExtract = () => {
    if (!src) return;
    const n = parseInt($('pln').value); $('plnv').textContent = n;
    const canvas = document.createElement('canvas');
    canvas.width = src.img.width; canvas.height = src.img.height;
    canvas.getContext('2d').drawImage(src.img, 0, 0);
    const id = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    const step = Math.max(1, Math.floor(Math.sqrt(id.length / 4 / 5000)));
    const pixels = [];
    for (let i = 0; i < id.length; i += 4 * step) {
      pixels.push({ r: id[i], g: id[i + 1], b: id[i + 2] });
    }
    const colors = medianCut(pixels, n);
    // Sort by brightness
    colors.sort((a, b) => (0.299 * a.r + 0.587 * a.g + 0.114 * a.b) - (0.299 * b.r + 0.587 * b.g + 0.114 * b.b));

    $('plResult').style.display = 'block'; $('plResult').classList.remove('collapsed');
    $('plBtns').style.display = 'flex';
    $('plSwatches').innerHTML = colors.map(c => {
      const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;cursor:pointer" onclick="window._plHighlight(${c.r},${c.g},${c.b})">
        <div style="width:36px;height:36px;border-radius:6px;background:${hex};border:1px solid var(--bd);flex-shrink:0"></div>
        <code style="font-size:11px">${hex.toUpperCase()}</code>
        <span style="font-size:10px;color:var(--tx3)">rgb(${c.r},${c.g},${c.b})</span>
      </div>`;
    }).join('');
    window._plColors = colors;
  };

  window._plHighlight = (r, g, b) => {
    if (!src) return;
    const pvC = $('plPrevCanvas'), ctx = pvC.getContext('2d');
    if (window._plHighlighted && window._plHighlighted.r === r && window._plHighlighted.g === g && window._plHighlighted.b === b) {
      ctx.drawImage(src.img, 0, 0, pvC.width, pvC.height);
      window._plHighlighted = null; return;
    }
    window._plHighlighted = { r, g, b };
    ctx.drawImage(src.img, 0, 0, pvC.width, pvC.height);
    const data = ctx.getImageData(0, 0, pvC.width, pvC.height);
    const t = 80, t2 = t * t;
    for (let i = 0; i < data.data.length; i += 4) {
      const dr = data.data[i] - r, dg = data.data[i + 1] - g, db = data.data[i + 2] - b;
      if (dr * dr + dg * dg + db * db > t2) {
        data.data[i] = Math.round(data.data[i] * 0.25);
        data.data[i + 1] = Math.round(data.data[i + 1] * 0.25);
        data.data[i + 2] = Math.round(data.data[i + 2] * 0.25);
      }
    }
    ctx.putImageData(data, 0, 0);
  };

  window._plCopyCSS = () => {
    const colors = window._plColors || [];
    if (!colors.length) return toast('请先提取配色');
    const vars = colors.map((c, i) => {
      const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
      return `  --color-${i + 1}: ${hex};`;
    }).join('\n');
    navigator.clipboard.writeText(':root {\n' + vars + '\n}').then(() => toast('CSS 变量已复制！'));
  };

  window._plDownSwatch = () => {
    const colors = window._plColors || [];
    if (!colors.length) return toast('请先提取配色');
    const sw = 60, sh = 40;
    const c = document.createElement('canvas');
    c.width = sw * colors.length; c.height = sh;
    const ctx = c.getContext('2d');
    colors.forEach((col, i) => {
      ctx.fillStyle = '#' + [col.r, col.g, col.b].map(v => v.toString(16).padStart(2, '0')).join('');
      ctx.fillRect(i * sw, 0, sw, sh);
    });
    c.toBlob(blob => { download(blob, 'palette.png'); toast('色板已下载'); }, 'image/png');
  };
}

    tool = b.dataset.t;
    $('antools').querySelectorAll('.mbtn').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('anFsGrp').classList.toggle('hidden', tool !== 'text');
  };

  function _anPos(e) {
    const ev = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
    const rect = $('anCanvas').getBoundingClientRect();
    return { x: (ev.clientX - rect.left) * $('anCanvas').width / rect.width, y: (ev.clientY - rect.top) * $('anCanvas').height / rect.height };
  }

  $('anCanvas').onmousedown = e => {
    const c = $('anCanvas');
    if (!c.width) return;
    // Save undo snapshot
    undoStack.push(c.getContext('2d').getImageData(0, 0, c.width, c.height));
    if (undoStack.length > 20) undoStack.shift();
    const p = _anPos(e); sx = p.x; sy = p.y; drawing = true;

    if (tool === 'text') {
      drawing = false;
      const txt = prompt('输入文字：');
      if (txt) {
        const ctx = c.getContext('2d');
        ctx.font = ($('anfs').value || 24) + 'px sans-serif';
        ctx.fillStyle = $('anc').value; ctx.fillText(txt, sx, sy);
      } else { undoStack.pop(); } // revert undo if cancelled
    } else if (tool === 'brush') {
      const ctx = c.getContext('2d');
      ctx.strokeStyle = $('anc').value;
      ctx.lineWidth = parseInt($('anw').value) || 3;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy);
    }
    e.preventDefault();
  };

  $('anCanvas').onmousemove = e => {
    if (!drawing) return;
    const p = _anPos(e); curX = p.x; curY = p.y;
    const c = $('anCanvas');
    const ctx = c.getContext('2d');
    const w = parseInt($('anw').value) || 3;

    if (tool === 'brush') {
      ctx.lineTo(p.x, p.y); ctx.stroke();
    } else {
      // Preview: restore + draw shape
      if (undoStack.length) ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      ctx.strokeStyle = $('anc').value; ctx.lineWidth = w;
      if (tool === 'rect') {
        ctx.strokeRect(sx, sy, p.x - sx, p.y - sy);
      } else if (tool === 'arrow') {
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke();
        // Arrowhead
        const angle = Math.atan2(p.y - sy, p.x - sx);
        const hl = 12 + w;
        ctx.fillStyle = $('anc').value;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - hl * Math.cos(angle - 0.4), p.y - hl * Math.sin(angle - 0.4));
        ctx.lineTo(p.x - hl * Math.cos(angle + 0.4), p.y - hl * Math.sin(angle + 0.4));
        ctx.closePath(); ctx.fill();
      }
    }
  };

  let curX = 0, curY = 0;
  document.removeEventListener('mouseup', window._anMouseUp);
  document.removeEventListener('touchend', window._anMouseUp);
  window._anMouseUp = () => {
    if (!drawing) return;
    drawing = false;
    if (tool === 'rect' || tool === 'arrow') {
      const c = $('anCanvas'), ctx = c.getContext('2d');
      if (undoStack.length) ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      const w = parseInt($('anw').value) || 3;
      ctx.strokeStyle = $('anc').value; ctx.lineWidth = w;
      if (tool === 'rect') {
        ctx.strokeRect(sx, sy, curX - sx, curY - sy);
      } else if (tool === 'arrow') {
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(curX, curY); ctx.stroke();
        const angle = Math.atan2(curY - sy, curX - sx);
        const hl = 12 + w;
        ctx.fillStyle = $('anc').value;
        ctx.beginPath();
        ctx.moveTo(curX, curY);
        ctx.lineTo(curX - hl * Math.cos(angle - 0.4), curY - hl * Math.sin(angle - 0.4));
        ctx.lineTo(curX - hl * Math.cos(angle + 0.4), curY - hl * Math.sin(angle + 0.4));
        ctx.closePath(); ctx.fill();
      }
    }
  };
  document.addEventListener('mouseup', window._anMouseUp);
  document.addEventListener('touchend', window._anMouseUp);
  $('anCanvas').ontouchstart = e => {
    const c = $('anCanvas');
    if (!c.width) return;
    undoStack.push(c.getContext('2d').getImageData(0, 0, c.width, c.height));
    if (undoStack.length > 20) undoStack.shift();
    const p = _anPos(e); sx = p.x; sy = p.y; drawing = true;
    if (tool === 'text') {
      drawing = false;
      const txt = prompt('输入文字：');
      if (txt) {
        const ctx = c.getContext('2d');
        ctx.font = ($('anfs').value || 24) + 'px sans-serif';
        ctx.fillStyle = $('anc').value; ctx.fillText(txt, sx, sy);
      } else { undoStack.pop(); }
    } else if (tool === 'brush') {
      const ctx = c.getContext('2d');
      ctx.strokeStyle = $('anc').value;
      ctx.lineWidth = parseInt($('anw').value) || 3;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy);
    }
    e.preventDefault();
  };
  $('anCanvas').ontouchmove = e => {
    if (!drawing) return;
    const p = _anPos(e); curX = p.x; curY = p.y;
    const c = $('anCanvas'); const ctx = c.getContext('2d');
    const w = parseInt($('anw').value) || 3;
    if (tool === 'brush') {
      ctx.lineTo(p.x, p.y); ctx.stroke();
    } else {
      if (undoStack.length) ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      ctx.strokeStyle = $('anc').value; ctx.lineWidth = w;
      if (tool === 'rect') {
        ctx.strokeRect(sx, sy, p.x - sx, p.y - sy);
      } else if (tool === 'arrow') {
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke();
        const angle = Math.atan2(p.y - sy, p.x - sx);
        const hl = 12 + w;
        ctx.fillStyle = $('anc').value;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - hl * Math.cos(angle - 0.4), p.y - hl * Math.sin(angle - 0.4));
        ctx.lineTo(p.x - hl * Math.cos(angle + 0.4), p.y - hl * Math.sin(angle + 0.4));
        ctx.closePath(); ctx.fill();
      }
    }
    e.preventDefault();
  };

  window._anUndo = () => {
    if (!undoStack.length || !$('anCanvas').width) return toast('没有可撤销的操作');
    $('anCanvas').getContext('2d').putImageData(undoStack.pop(), 0, 0);
    toast('已撤销 (' + undoStack.length + ' 步剩余)');
  };
  window._anClear = () => {
    if (!src) return;
    const c = $('anCanvas');
    c.getContext('2d').drawImage(src.img, 0, 0, c.width, c.height);

  };
  window._anDownload = () => {

      toast('下载成功！', 'suc');

  window._anQueue = () => {
    const c = $('anCanvas');
    if (!c.width) return toast('请先处理图片');
    saveToolSettings('t-annotate');
    c.toBlob(blob => {
      BatchQueue.add(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '图片标注', 'image/png'), '图片标注');
    }, 'image/png');
  };
}

// PIXELATE — global pixelation
// ============================================================
function renderPixelate() {
  let src = null, pxCanvas = null, painting = false, pxMode = 'brush', rectStart = null, rectSaved = null;
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="pxupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传图片</div><div class="dh">📥 松开即可上传</div><input type="file" id="pxinput" accept="image/*" hidden></div>
        ${renderPresetRow('t-pixelate')}
        <div class="sect"><h3>模式</h3><div class="sect-body">
          <div class="pills" id="pxmode"><button class="pill on" data-m="brush">🖌️ 画笔</button><button class="pill" data-m="rect">📐 矩形</button></div>
        </div></div>
        <div class="sect"><h3>画笔设置</h3><div class="sect-body">
          <div class="slider"><div class="slid-l"><span>画笔大小</span><span id="pxszv">30</span></div><input type="range" id="pxsz" min="5" max="100" value="30" oninput="$('pxszv').textContent=this.value"></div>
          <div class="slider"><div class="slid-l"><span>像素块</span><span id="pxbv">10</span></div><input type="range" id="pxb" min="2" max="60" value="10" oninput="$('pxbv').textContent=this.value"></div>
          <div style="font-size:10px;color:var(--tx3);margin-top:4px" id="pxhint">💡 在图片上拖动鼠标涂抹像素化区域</div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._pxDownload()">💾 下载</button><button class="btn btn2" onclick="window._pxReset()">🔄 重置</button><button class="btn btn2" onclick="window._pxQueue()">📥 添加到队列</button></div>
        <div style="font-size:11px;color:var(--tx2);margin-top:4px" id="pxout">输出：-</div>
      </div>
      <div class="tool-r"><div class="prev" style="padding:0;overflow:auto;background:var(--inp)"><canvas id="pxCanvas" style="display:block;max-width:100%;cursor:crosshair"></canvas></div></div>
    </div>`;

  setupCollapse('v-tool');
  setupDrop('pxupload', 'pxinput', async f => {
    src = await loadImg(f); showUpload('pxupload', src.dataUrl);
    pxCanvas = $('pxCanvas');
    const maxW = Math.min(600, $('v-tool').querySelector('.tool-r').clientWidth - 32);
    const s = Math.min(1, maxW / src.img.width);
    pxCanvas.width = src.img.width * s; pxCanvas.height = src.img.height * s;
    pxCanvas.getContext('2d').drawImage(src.img, 0, 0, pxCanvas.width, pxCanvas.height);
  });

  // Mode toggle
  $('pxmode').onclick = e => {
    const b = e.target.closest('.pill'); if (!b) return;
    pxMode = b.dataset.m;
    $('pxmode').querySelectorAll('.pill').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('pxhint').textContent = pxMode === 'rect' ? '💡 拖拽矩形选区进行像素化' : '💡 在图片上拖动鼠标涂抹像素化区域';
  };

  function _pxGetPos(e) {
    const ev = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
    const rect = pxCanvas.getBoundingClientRect();
    return { x: (ev.clientX - rect.left) * pxCanvas.width / rect.width, y: (ev.clientY - rect.top) * pxCanvas.height / rect.height };
  }
  // Shared pixelation logic for a rectangle area
  function _pxPixelateRect(sx, sy, sw, sh, bs) {
    const c = $('pxCanvas'), ctx = c.getContext('2d');
    if (sw <= 0 || sh <= 0) return;
    const smallW = Math.max(1, Math.floor(sw / bs)), smallH = Math.max(1, Math.floor(sh / bs));
    const off = document.createElement('canvas'); off.width = smallW; off.height = smallH;
    off.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, smallW, smallH);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, sx, sy, sw, sh);
    ctx.imageSmoothingEnabled = true;
  }

  pxCanvas = $('pxCanvas'); // placeholder
  $('pxCanvas').onmousedown = e => {
    const pos = _pxGetPos(e);
    if (pxMode === 'rect') {
      rectStart = pos;
      rectSaved = pxCanvas.getContext('2d').getImageData(0, 0, pxCanvas.width, pxCanvas.height);
      painting = true;
    } else {
      painting = true; _pxPaint(pos);
    }
    e.preventDefault();
  };
  $('pxCanvas').onmousemove = e => {
    if (!painting) return;
    const pos = _pxGetPos(e);
    if (pxMode === 'rect' && rectStart) {
      const ctx = pxCanvas.getContext('2d');
      ctx.putImageData(rectSaved, 0, 0);
      const x = Math.min(rectStart.x, pos.x), y = Math.min(rectStart.y, pos.y);
      const w = Math.abs(pos.x - rectStart.x), h = Math.abs(pos.y - rectStart.y);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
    } else {
      _pxPaint(pos);
    }
  };
  document.removeEventListener('mouseup', window._pxMouseUp);
  document.removeEventListener('touchend', window._pxMouseUp);
  window._pxMouseUp = e => {
    if (!painting) return;
    if (pxMode === 'rect' && rectStart && rectSaved) {
      const c = $('pxCanvas');
      const ctx = c.getContext('2d');
      ctx.putImageData(rectSaved, 0, 0);
      const pos = _pxGetPos(e);
      const x = Math.max(0, Math.min(rectStart.x, pos.x)), y = Math.max(0, Math.min(rectStart.y, pos.y));
      const w = Math.min(Math.abs(pos.x - rectStart.x), c.width - x), h = Math.min(Math.abs(pos.y - rectStart.y), c.height - y);
      _pxPixelateRect(x, y, w, h, parseInt($('pxb').value));
    }
    painting = false; rectStart = null; rectSaved = null;
  };
  document.addEventListener('mouseup', window._pxMouseUp);
  document.addEventListener('touchend', window._pxMouseUp);
  // Touch handlers
  $('pxCanvas').ontouchstart = e => {
    const pos = _pxGetPos(e);
    if (pxMode === 'rect') {
      rectStart = pos;
      rectSaved = pxCanvas.getContext('2d').getImageData(0, 0, pxCanvas.width, pxCanvas.height);
      painting = true;
    } else {
      painting = true; _pxPaint(pos);
    }
    e.preventDefault();
  };
  $('pxCanvas').ontouchmove = e => {
    if (!painting) return;
    const pos = _pxGetPos(e);
    if (pxMode === 'rect' && rectStart) {
      const ctx = pxCanvas.getContext('2d');
      ctx.putImageData(rectSaved, 0, 0);
      const x = Math.min(rectStart.x, pos.x), y = Math.min(rectStart.y, pos.y);
      const w = Math.abs(pos.x - rectStart.x), h = Math.abs(pos.y - rectStart.y);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
    } else {
      _pxPaint(pos);
    }
    e.preventDefault();
  };

  function _pxPaint(pos) {
    const r = parseInt($('pxsz').value), bs = parseInt($('pxb').value);
    const c = $('pxCanvas');
    const sx = Math.max(0, pos.x - r), sy = Math.max(0, pos.y - r);
    const sw = Math.min(r * 2, c.width - sx), sh = Math.min(r * 2, c.height - sy);
    const ctx = c.getContext('2d');
    ctx.save(); ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.clip();
    _pxPixelateRect(sx, sy, sw, sh, bs);
    ctx.restore();
  }

  window._pxReset = () => {
    if (!src) return;
    const c = $('pxCanvas');
    c.getContext('2d').drawImage(src.img, 0, 0, c.width, c.height);
    toast('已重置');
  };
  window._pxDownload = () => {
    if (!src) return toast('请先上传图片');
    $('pxCanvas').toBlob(blob => {
      $('pxout').textContent = '输出：' + $('pxCanvas').width + '\xd7' + $('pxCanvas').height + ' · ' + fmtSize(blob.size);
      download(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '像素化', 'image/png'));
      toast('下载成功！', 'suc');
    }, 'image/png');
  };
  window._pxQueue = () => {
    if (!src) return toast('请先处理图片');
    $('pxCanvas').toBlob(blob => {
      BatchQueue.add(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '像素化', 'image/png'), '像素化');
    }, 'image/png');
  };
}

    $('txrv').textContent = rot + '°';
    offX = parseInt($('txoffx').value) || 0; offY = parseInt($('txoffy').value) || 0;
    $('txoxv').textContent = offX + '%'; $('txoyv').textContent = offY + '%';
    const canvas = document.createElement('canvas');
    canvas.width = src.img.width; canvas.height = src.img.height;
    const ctx = canvas.getContext('2d'); ctx.drawImage(src.img, 0, 0);
    const ff = ($('txff')?.value) || 'sans-serif';
    ctx.fillStyle = clr; ctx.font = `${bold ? 'bold ' : ''}${size}px ${ff}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = txt.split('\n');
    const lh = size * 1.3;
    const pad = size * 0.4;
    const totalH = lines.length * lh;
    let cx, cy;
    if (pos.includes('l')) cx = pad + ctx.measureText(lines.reduce((a,l)=>l.length>a.length?l:a,'')).width/2;
    else if (pos.includes('r')) cx = canvas.width - pad - ctx.measureText(lines.reduce((a,l)=>l.length>a.length?l:a,'')).width/2;
    else cx = canvas.width / 2;
    if (pos.includes('t')) cy = pad + totalH / 2;
    else if (pos.includes('b')) cy = canvas.height - pad - totalH / 2;
    else cy = canvas.height / 2;
    cx += offX * canvas.width / 100; cy += offY * canvas.height / 100;
    if (outline) { ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(2, size / 10); }
    if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = size * 0.3; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2; }
    if (rot) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 180); ctx.translate(-cx, -cy); }
    lines.forEach((line, i) => {
      const y = cy - totalH/2 + i * lh + lh/2;
      if (outline) ctx.strokeText(line, cx, y);
      ctx.fillText(line, cx, y);
    });
    if (rot) ctx.restore();
    out = canvas;
    $('txprev').innerHTML = `<img src="${canvas.toDataURL('image/png')}" style="max-height:100%">`;
  };
  window._txDownload = () => {
    if (!out) return toast('请先添加文字');
    saveToolSettings('t-text');
    out.toBlob(blob => {
      $('txout').textContent = '输出：' + out.width + '\xd7' + out.height + ' · ' + fmtSize(blob.size);
      download(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '文字添加', 'image/png'));
      toast('下载成功！', 'suc');
    }, 'image/png');
  };
  window._txQueue = () => {
    if (!out) return toast('请先处理图片');
    saveToolSettings('t-text');
    out.toBlob(blob => {
      BatchQueue.add(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '文字添加', 'image/png'), '文字添加');
    }, 'image/png');
  };
}

// Init: apply saved accent + theme
function applySystemTheme() {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  $('sTheme').textContent = prefersDark ? '☀️' : '🌙';
}
{
  const g = Settings.getGlobal();
  document.documentElement.setAttribute('data-accent', g.accent || 'blue');
  if (!g.themeExplicit) applySystemTheme();
  else $('sTheme').textContent = (g.theme || 'dark') === 'dark' ? '☀️' : '🌙';
}
// Listen for system theme changes
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!Settings.getGlobal().themeExplicit) applySystemTheme();
});

// Paste support
History._init();
go('home');

// Queue panel drop zone — drag files/folders to add to queue
(function() {
  var qp = $('qpanel');
  if (!qp) return;
  qp.ondragover = function(e) { e.preventDefault(); e.stopPropagation(); qp.classList.add('drag'); };
  qp.ondragleave = function() { qp.classList.remove('drag'); };
  qp.ondrop = async function(e) {
    e.preventDefault(); e.stopPropagation(); qp.classList.remove('drag');
    var files = await _getDropFiles(e.dataTransfer);
    if (!files.length) return;
    toast('正在导入 ' + files.length + ' 个文件…', 'info');
    for (var i = 0; i < files.length; i++) {
      try { var d = await loadImg(files[i]); var c = document.createElement('canvas'); c.width = d.img.width; c.height = d.img.height; c.getContext('2d').drawImage(d.img, 0, 0); var blob = await canvasToBlob(c, files[i].type, 0.92); BatchQueue.add(blob, files[i].name, '拖拽导入'); } catch (_) {}
    }
    toast('已导入 ' + files.length + ' 个文件', 'suc');
  };
})();
