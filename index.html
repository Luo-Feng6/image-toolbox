// Preset UI helper
function renderPresetRow(toolId) {
  const presets = Settings.getPresets(toolId);
  const names = Object.keys(presets);
  let opts = '<option value="">-- 预设 --</option>';
  names.forEach(n => { const desc = presets[n]._desc || ''; opts += '<option value="' + n + '"' + (desc ? ' title="' + desc.replace(/"/g,'&quot;') + '"' : '') + '>' + n + '</option>'; });
  return '<div class="preset-row"><select id="' + toolId + 'preset" onchange="window._presetLoad(\'' + toolId + '\',this.value)">' + opts + '</select><button class="btn btn2" style="font-size:10px;padding:4px 8px;flex-shrink:0" onclick="window._presetSave(\'' + toolId + '\')" title="保存预设">💾</button>' + (names.length ? '<button class="btn btn2" style="font-size:10px;padding:4px 8px;flex-shrink:0" onclick="window._presetRename(\'' + toolId + '\')" title="重命名">✏️</button><button class="btn btn2" style="font-size:10px;padding:4px 8px;flex-shrink:0" onclick="window._presetDel(\'' + toolId + '\')" title="删除">🗑</button>' : '') + '</div>';
}

window._presetRename = function(toolId) {
  const sel = document.getElementById(toolId + 'preset');
  if (!sel || !sel.value) return toast('请先选择预设');
  const oldName = sel.value;
  const newName = prompt('重命名预设：', oldName);
  if (!newName || newName === oldName) return;
  const presets = Settings.getPresets(toolId);
  if (presets[newName]) return toast('名称已存在');
  presets[newName] = presets[oldName];
  delete presets[oldName];
  Store.set('pr-' + toolId, presets);
  sel.parentElement.outerHTML = renderPresetRow(toolId);
  toast('已重命名：' + oldName + ' → ' + newName);
};
window._presetSave = function(toolId) {
  const name = prompt('预设名称：');
  if (!name) return;
  const presets = Settings.getPresets(toolId);
  if (presets[name] && !confirm('预设 "' + name + '" 已存在，是否覆盖？')) return;
  const desc = prompt('预设说明（可选）：') || '';
  const config = { _desc: desc };
  $('v-tool').querySelectorAll('input[type=range], input[type=number], input[type=text], input[type=color], select, input[type=checkbox]').forEach(el => {
    if (el.id) config[el.id] = el.type === 'checkbox' ? el.checked : el.value;
  });
  $('v-tool').querySelectorAll('.mbtn.on').forEach(el => config['_mode'] = el.dataset.m);
  $('v-tool').querySelectorAll('.pill.on').forEach(el => { if (el.dataset.r) config['_gridR'] = el.dataset.r; if (el.dataset.c) config['_gridC'] = el.dataset.c; if (el.dataset.p) config['_pct'] = el.dataset.p; });
  Settings.savePreset(toolId, name, config);
  const sel = document.getElementById(toolId + 'preset');
  if (sel?.parentElement) sel.parentElement.outerHTML = renderPresetRow(toolId);
  toast('预设已保存：' + name);
};

window._presetLoad = function(toolId, name) {
  if (!name) return;
  const config = Settings.getPresets(toolId)[name];
  if (!config) return;
  for (const [id, val] of Object.entries(config)) {
    if (id.startsWith('_')) continue; // mode/pill handled separately
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = val;
    else if (el.type === 'range') { el.value = val; el.dispatchEvent(new Event('input')); }
    else el.value = val;
  }
  // Apply mode
  if (config._mode) {
    const modeBtns = document.querySelectorAll('.mbtn');
    modeBtns.forEach(b => { b.classList.toggle('on', b.dataset.m === config._mode); });
  }
  // Trigger update on current tool
  ['_cpUpdate','_cvUpdate','_rsUpdate','_rtUpdate','_btUpdate','_b64Update',
   '_gdUpdate','_stUpdate','_bdUpdate','_scUpdate','_slUpdate','_ftUpdate','_wmUpdate','_idUpdate','_pkRender','_plExtract']
    .forEach(fn => { if (typeof window[fn] === 'function') window[fn](); });
  toast('已加载预设：' + name);
};

window._presetDel = function(toolId) {
  const sel = document.getElementById(toolId + 'preset');
  if (!sel || !sel.value) return;
  showConfirm('删除预设 "' + sel.value + '"？', () => {
    Settings.deletePreset(toolId, sel.value);
    sel.parentElement.outerHTML = renderPresetRow(toolId);
    toast('已删除');
  });
};

// Auto-restore tool settings
function restoreToolSettings(toolId) {
  const saved = Settings.getTool(toolId);
  if (!Object.keys(saved).length) return;
  for (const [id, val] of Object.entries(saved)) {
    if (id.startsWith('_')) continue;
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = val;
    else el.value = val;
  }
  // Restore mode button (deferred: onclick handlers + update fns not defined yet)
  if (saved._mode) {
    setTimeout(() => {
      const btn = document.querySelector(`.mbtn[data-m="${saved._mode}"]`);
      if (btn) btn.click();
    }, 0);
  }
}

    const fmt = $('cpfmt').value, w = parseInt($('cpw').value) || ow, h = parseInt($('cph').value) || oh;

    $('cpinfo2').textContent = '预估 ~' + fmtSize(Math.round(Math.max(estSize, 1024)));
    let q = qRaw;
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;

    if (mode === 'size') { const target = parseInt($('cptarget').value) * 1024; let lo = 0.01, hi = 1.0; for (let i = 0; i < 10; i++) { const mid = (lo + hi) / 2; const b = await canvasToBlob(canvas, fmt, mid); if (b.size > target) hi = mid; else lo = mid; if (hi - lo < 0.01) break; } q = lo; }
    outBlob = await canvasToBlob(canvas, fmt, q);
    const url = URL.createObjectURL(outBlob);
    $('cpprev').innerHTML = ''; _renderCompare(src.dataUrl, url, 'cpprev', ['原图','压缩']);
    $('cpinfo2').textContent = `${fmt.split('/')[1].toUpperCase()} · ${w}×${h} · ${fmtSize(outBlob.size)}`;
    const rate = (1 - outBlob.size / src.file.size) * 100;
    $('cpbar').style.width = Math.max(0, rate) + '%';
    $('cprate').textContent = rate > 0 ? `↓ ${rate.toFixed(1)}%  节省 ${fmtSize(src.file.size - outBlob.size)}` : '体积增大';
  };
  window._cpDownload = () => { if (outBlob) { saveToolSettings('t-compress'); const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '图片压缩', $('cpfmt').value); download(outBlob, fn); toast('下载成功！', 'suc'); } else toast('请先上传图片'); };
  window._cpCopy = () => { if (outBlob) copyImg(outBlob); else toast('请先上传图片'); };
	  window._cpQueue = () => { if (outBlob) { saveToolSettings('t-compress'); const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '图片压缩', $('cpfmt').value); BatchQueue.add(outBlob, fn, '图片压缩'); } else toast('请先处理图片'); };

function renderCrop() {
  let src = null, rotation = 0, fh = false, fv = false, ratio = 'free', drag = null;
  let box = { x: 0, y: 0, w: 0, h: 0 }, cropBlob = null;
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="crupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传</div><div class="dh">📥 松开即可上传</div><input type="file" id="crinput" accept="image/*" hidden></div>
        <div class="sect"><h3>预设</h3><div class="sect-body" id="crpreset"></div></div>
        <div class="sect"><h3>比例</h3><div class="sect-body"><div class="pills" id="crratios">
          <button class="pill on" data-r="free">自由</button><button class="pill" data-r="1:1">1:1</button><button class="pill" data-r="4:3">4:3</button><button class="pill" data-r="16:9">16:9</button><button class="pill" data-r="9:16">9:16</button>
        </div></div></div>
	        <div class="sect"><h3>构图线</h3><div class="sect-body"><div class="pills" id="crguides"><button class="pill on" data-g="thirds">📐 三分线</button><button class="pill" data-g="golden">🐚 黄金比例</button><button class="pill" data-g="grid">🔲 网格</button><button class="pill" data-g="cross">✚ 十字</button><button class="pill" data-g="">❌ 关闭</button></div></div></div>
        <div class="sect"><h3>旋转</h3><div class="sect-body">
          <div class="modes"><button class="mbtn" onclick="window._crRot(-90)"><span class="mi">↺</span>逆90°</button><button class="mbtn" onclick="window._crRot(90)"><span class="mi">↻</span>顺90°</button><button class="mbtn" onclick="window._crFlip('h')"><span class="mi">↔</span>水平翻转</button><button class="mbtn" onclick="window._crFlip('v')"><span class="mi">↕</span>垂直翻转</button></div>
          <div class="slider" style="margin-top:8px"><div class="slid-l"><span>角度</span><span id="crangv">0°</span></div><input type="range" id="crang" min="-45" max="45" value="0" oninput="window._crAngle()"></div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._crApply()">✂️ 裁剪并下载</button><button class="btn btn2" onclick="window._crCopy()">📋 复制</button><button class="btn btn2" onclick="window._crQueue()">📥 添加到队列</button></div>
        <div style="font-size:11px;color:var(--tx2);margin-top:4px" id="crout">输出：-</div>
      </div>
      <div class="tool-r">
        <div class="prev" style="padding:0;overflow:auto;background:var(--inp)">
          <div class="crop-wrap" id="crcwrap"><canvas id="crcanvas"></canvas><div class="crop-box" id="crbox"><div class="crop-guide thirds" id="crguide"></div><div class="ch nw" data-d="nw"></div><div class="ch ne" data-d="ne"></div><div class="ch sw" data-d="sw"></div><div class="ch se" data-d="se"></div><div class="ch n" data-d="n"></div><div class="ch s" data-d="s"></div><div class="ch w" data-d="w"></div><div class="ch e" data-d="e"></div></div></div>
          <div class="pe" id="crempty">等待上传…</div>
        </div>
      </div>
    </div>`;

  setupCollapse('v-tool');
  $('crpreset').innerHTML = renderPresetRow('t-crop');
  restoreToolSettings('t-crop');
  setupDrop('crupload', 'crinput', async f => {
    src = await loadImg(f); rotation = 0; fh = false; fv = false; cropBlob = null;
    $('crang').value = 0; $('crangv').textContent = '0°';
    showUpload('crupload', src.dataUrl);
    $('crempty').style.display = 'none';
    _crInit();
  });
  $('crratios').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; ratio = b.dataset.r; $('crratios').querySelectorAll('.pill').forEach(p => p.classList.remove('on')); b.classList.add('on'); };
  $('crguides').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; $('crguides').querySelectorAll('.pill').forEach(p => p.classList.remove('on')); b.classList.add('on'); $('crguide').className = 'crop-guide ' + b.dataset.g; };

  function _crInit() {
    const canvas = $('crcanvas'), img = src.img, maxW = Math.min(560, $('v-tool').querySelector('.tool-r').clientWidth - 32), s = Math.min(1, maxW / img.width);
    canvas.width = img.width * s; canvas.height = img.height * s;
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    box = { x: canvas.width * .1, y: canvas.height * .1, w: canvas.width * .8, h: canvas.height * .8 };
    _crDraw();
  }
  function _crDraw() { const b = $('crbox'); b.style.left = box.x + 'px'; b.style.top = box.y + 'px'; b.style.width = box.w + 'px'; b.style.height = box.h + 'px'; }

  window._crRot = d => { rotation = (rotation + d) % 360; $('crang').value = rotation; $('crangv').textContent = rotation + '°'; };
  window._crFlip = d => { if (d === 'h') fh = !fh; else fv = !fv; };
  window._crAngle = () => { rotation = parseInt($('crang').value); $('crangv').textContent = rotation + '°'; };

  $('crbox').onmousedown = e => { if (e.target.classList.contains('ch')) return; drag = { type: 'move', sx: e.clientX, sy: e.clientY, ox: box.x, oy: box.y }; e.preventDefault(); };
  $('crbox').querySelectorAll('.ch').forEach(h => { h.onmousedown = e => { drag = { type: 'resize', d: h.dataset.d, sx: e.clientX, sy: e.clientY, ox: box.x, oy: box.y, ow: box.w, oh: box.h }; e.stopPropagation(); }; });
  document.onmousemove = e => {
    if (!drag) return;
    const cw = $('crcanvas').width, ch = $('crcanvas').height, dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (drag.type === 'move') { box.x = Math.max(0, Math.min(cw - box.w, drag.ox + dx)); box.y = Math.max(0, Math.min(ch - box.h, drag.oy + dy)); }
    else {
      let nx = drag.ox, ny = drag.oy, nw = drag.ow, nh = drag.oh; const d = drag.d;
      if (d.includes('e')) nw = Math.max(20, drag.ow + dx);
      if (d.includes('w')) { nw = Math.max(20, drag.ow - dx); nx = drag.ox + drag.ow - nw; }
      if (d.includes('s')) nh = Math.max(20, drag.oh + dy);
      if (d.includes('n')) { nh = Math.max(20, drag.oh - dy); ny = drag.oy + drag.oh - nh; }
      if (ratio !== 'free') { const [rw, rh] = ratio.split(':').map(Number); const r = rw / rh; if (Math.abs(dx) > Math.abs(dy)) nh = nw / r; else nw = nh * r; }
      nx = Math.max(0, nx); ny = Math.max(0, ny); if (nx + nw > cw) nw = cw - nx; if (ny + nh > ch) nh = ch - ny;
      box = { x: nx, y: ny, w: Math.max(20, nw), h: Math.max(20, nh) };
    }
    _crDraw();
  };
  document.onmouseup = () => { drag = null; };

  async function _crGetBlob() {
    const canvas = $('crcanvas'), sx = src.img.width / canvas.width, sy = src.img.height / canvas.height;
    const out = document.createElement('canvas'); out.width = box.w * sx; out.height = box.h * sy;
    const ctx = out.getContext('2d');
    ctx.save(); ctx.translate(out.width / 2, out.height / 2); ctx.rotate(rotation * Math.PI / 180);
    if (fh) ctx.scale(-1, 1); if (fv) ctx.scale(1, -1);
    ctx.drawImage(src.img, box.x * sx, box.y * sy, box.w * sx, box.h * sy, -out.width / 2, -out.height / 2, out.width, out.height);
    ctx.restore();
    return new Promise(resolve => out.toBlob(resolve));
  }
  window._crApply = async () => {
    if (!src) return toast('请先上传');
    saveToolSettings('t-crop');
    cropBlob = await _crGetBlob();
    $('crout').textContent = '输出：' + $('crcanvas').width + '\xd7' + $('crcanvas').height + ' · ' + fmtSize(cropBlob.size);
    const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '图片裁剪', 'image/png');
    download(cropBlob, fn); toast('裁剪完成！');
  };
  window._crCopy = async () => {
    if (!src) return toast('请先上传');
    if (!cropBlob) cropBlob = await _crGetBlob();
    try { await navigator.clipboard.write([new ClipboardItem({[cropBlob.type||'image/png']:cropBlob})]); toast('已复制到剪贴板！','suc'); } catch(e) { toast('复制失败：'+e.message,'err'); }
  };
  window._crQueue = async () => {
    if (!src) return toast('请先上传');
    if (!cropBlob) cropBlob = await _crGetBlob();
    saveToolSettings('t-crop');
    const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '图片裁剪', 'image/png');
    BatchQueue.add(cropBlob, fn, '图片裁剪');
  };
}

// ============================================================
// EXIF
// ============================================================
function parseExif(buf) {
  const dv = new DataView(buf);
  if (dv.getUint16(0) !== 0xFFD8) return null;
  let off = 2;
  while (off < dv.byteLength - 1) {
    if (dv.getUint8(off) !== 0xFF) break;
    if (dv.getUint8(off + 1) === 0xE1) break;
    off += 2 + dv.getUint16(off + 2);
  }
  if (off >= dv.byteLength - 1 || dv.getUint8(off + 1) !== 0xE1) return null;
  const app1 = off + 4;
  if (dv.getUint8(app1) !== 0x45) return null;
  const tiff = app1 + 6;
  const le = dv.getUint16(tiff) === 0x4949;
  if (dv.getUint16(tiff + 2, le) !== 0x002A) return null;
  const sizes = [0, 1, 1, 2, 4, 8, 1, 1, 2, 4, 8];

  function readIFD(base, target) {
    const n = dv.getUint16(tiff + base, le);
    for (let i = 0; i < n; i++) {
      const e = tiff + base + 2 + i * 12;
      const tag = dv.getUint16(e, le), type = dv.getUint16(e + 2, le), count = dv.getUint32(e + 4, le);
      const voff = e + 8, total = (sizes[type] || 1) * count;
      let val = null;
      if (total <= 4) {
        if (type === 2) { let s = ''; for (let j = 0; j < total; j++) { const c = dv.getUint8(voff + j); if (!c) break; s += String.fromCharCode(c); } val = s; }
        else if (type === 3) val = dv.getUint16(voff, le);
        else val = dv.getUint32(voff, le);
      } else {
        const doff = tiff + dv.getUint32(voff, le);
        if (type === 2) { let s = ''; for (let j = 0; j < count - 1; j++) s += String.fromCharCode(dv.getUint8(doff + j)); val = s; }
        else if (type === 3) val = dv.getUint16(doff, le);
        else if (type === 5 && count > 1) { val = []; for (let j = 0; j < count; j++) val.push(dv.getUint32(doff + j * 8, le) / dv.getUint32(doff + j * 8 + 4, le)); }
        else if (type === 5) val = dv.getUint32(doff, le) / dv.getUint32(doff + 4, le);
        else val = dv.getUint32(doff, le);
      }
      target[tag] = val;
    }
    return dv.getUint32(tiff + base + 2 + n * 12, le);
  }

  const ifd0 = {}, subifd = {}, gps = {};
  readIFD(dv.getUint32(tiff + 4, le), ifd0);
  if (ifd0[0x8769] != null) readIFD(ifd0[0x8769], subifd);
  if (ifd0[0x8825] != null) readIFD(ifd0[0x8825], gps);
  return { ifd0, subifd, gps };
}

function renderExif() {
  let src = null, exif = null, exBlob = null;
  $('v-tool').innerHTML = `

      </div>
      <div class="tool-r">
        <div class="prev" id="exprev"><div class="pe">等待上传…</div></div>
        <div id="exgps" style="display:none;margin-top:6px;padding:8px 12px;background:rgba(var(--rd-rgb),.1);border:1px solid var(--rd);border-radius:var(--rs);font-size:11px;color:var(--rd)">⚠️ 此照片含 GPS 位置，分享前建议清除</div>
      </div>

  setupCollapse('v-tool');
  $('expreset').innerHTML = renderPresetRow('t-exif');
  restoreToolSettings('t-exif');
  setupDrop('exupload', 'exinput', async f => {
    src = await loadImg(f); exBlob = null; showUpload('exupload', src.dataUrl);
    $('exprev').innerHTML = '<img src="' + src.dataUrl + '" style="max-height:300px">';
    const buf = await f.arrayBuffer();
    exif = parseExif(buf);
    $('exdata').style.display = 'block'; $('exdata').classList.remove('collapsed');
    if (!exif) { $('exitems').innerHTML = '<div style="color:var(--tx3);text-align:center;padding:16px">未检测到 EXIF 数据<br><small>截图或已处理图片通常不含 EXIF</small></div>'; return; }

    const rows = [];
    const ev = tags => { for (const t of tags) { const v = exif.subifd[t] ?? exif.ifd0[t] ?? exif.gps[t]; if (v != null && v !== '') return v; } return null; };
    const make = ev([0x010F]), model = ev([0x0110]);

    const iso = ev([0x8827]);
    if (iso != null) rows.push(['⚙️', 'ISO', iso]);
    const ap = ev([0x829D]);
    if (ap != null) rows.push(['', '光圈', 'f/' + (Math.round(ap * 10) / 10)]);
    const sh = ev([0x829A]);
    if (sh != null) rows.push(['', '快门', sh < 1 ? '1/' + Math.round(1 / sh) + 's' : sh.toFixed(1) + 's']);
    const fl = ev([0x920A]);
    if (fl != null) rows.push(['', '焦距', Math.round(fl) + 'mm']);
    const dt = ev([0x9003, 0x0132]);
    if (dt) rows.push(['📅', '时间', dt]);
    const lat = exif.gps[0x0002], lon = exif.gps[0x0004];
    if (lat && lon && Array.isArray(lat) && Array.isArray(lon)) {
      const ref = (arr, r) => { let d = arr[0] + arr[1] / 60 + arr[2] / 3600; return (r === 'S' || r === 'W') ? -d : d; };
      const la = ref(lat, exif.gps[0x0001]), lo = ref(lon, exif.gps[0x0003]);
      rows.push(['📍', 'GPS', la.toFixed(6) + ', ' + lo.toFixed(6) + ' <a href="https://maps.google.com/?q=' + la + ',' + lo + '" target="_blank" style="color:var(--ac);font-size:10px">地图</a>']);
      $('exgps').style.display = 'block';
    } else $('exgps').style.display = 'none';
    rows.push(['📐', '尺寸', (ev([0xA002]) || src.img.width) + ' × ' + (ev([0xA003]) || src.img.height)]);
    const sw = ev([0x0131]); if (sw) rows.push(['🔧', '软件', sw]);
    const ori = ev([0x0112]);
    if (ori != null) { const om = {1:'正常',3:'180°',6:'顺时针90°',8:'逆时针90°'}; rows.push(['📋', '方向', om[ori] || '未知']); }
    $('exitems').innerHTML = rows.map(r => '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px"><span style="width:24px;text-align:center;flex-shrink:0">' + r[0] + '</span><span style="color:var(--tx3);width:48px;flex-shrink:0;font-size:11px">' + r[1] + '</span><span style="word-break:break-all">' + r[2] + '</span></div>').join('');
  });

  window._exClear = async () => {
    if (!src) return toast('请先上传图片');
    const c = document.createElement('canvas'); c.width = src.img.width; c.height = src.img.height;
    c.getContext('2d').drawImage(src.img, 0, 0);
    exBlob = await canvasToBlob(c, 'image/jpeg', 0.92);
    saveToolSettings('t-exif'); const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, 'EXIF清除', 'image/jpeg'); download(exBlob, fn); toast('已清除 EXIF 并下载！');
  };
  window._exQueue = () => { if (exBlob) { saveToolSettings('t-exif'); const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, 'EXIF清除', 'image/jpeg'); BatchQueue.add(exBlob, fn, 'EXIF清除'); } else toast('请先清除 EXIF'); };
}

function renderGrid() {
  let src = null, slices = [];
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="gdupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传</div><div class="dh">📥 松开即可上传</div><input type="file" id="gdinput" accept="image/*" hidden></div>
        <div class="sect"><h3>预设</h3><div class="sect-body" id="gdpreset"></div></div>
        <div class="sect"><h3>网格</h3><div class="sect-body">
          <div class="pills" id="gdgrids">
            <button class="pill" data-r="2" data-c="2">2×2</button><button class="pill on" data-r="3" data-c="3">3×3</button><button class="pill" data-r="4" data-c="4">4×4</button>
          </div>
          <div class="irow" style="margin-top:8px"><label>自定义</label><input type="number" id="gdrows" value="3" min="1" max="10" style="width:50px" onchange="window._gdUpdate()"><span style="margin:0 2px">×</span><input type="number" id="gdcols" value="3" min="1" max="10" style="width:50px" onchange="window._gdUpdate()"></div>
          <div class="irow"><label>格式</label><select id="gdfmt" onchange="window._gdUpdate()"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._gdDownload()">💾 逐张下载</button><button class="btn btn2" onclick="window._gdZip()">📦 ZIP 下载</button><button class="btn btn2" onclick="window._gdQueue()">📥 添加到队列</button></div>
      </div>
      <div class="tool-r">
        <div class="prev" id="gdprev" style="position:relative"><div class="pe">等待上传…</div></div>
        <div id="gdinfo" style="font-size:11px;color:var(--tx2);text-align:center;padding:4px;display:none"></div>
      </div>
    </div>`;

  setupCollapse('v-tool');
  $('gdpreset').innerHTML = renderPresetRow('t-grid');
  restoreToolSettings('t-grid');
  setupDrop('gdupload', 'gdinput', async f => { src = await loadImg(f); showUpload('gdupload', src.dataUrl); _gdUpdate(); });

  $('gdgrids').onclick = e => {
    const b = e.target.closest('.pill'); if (!b) return;
    $('gdrows').value = b.dataset.r; $('gdcols').value = b.dataset.c;
    $('gdgrids').querySelectorAll('.pill').forEach(x => x.classList.remove('on')); b.classList.add('on');
    _gdUpdate();
  };

  window._gdUpdate = async () => {
    const rows = parseInt($('gdrows').value) || 3, cols = parseInt($('gdcols').value) || 3;
    if (!src) return;
    const fmt = $('gdfmt').value;
    const sw = Math.round(src.img.width / cols), sh = Math.round(src.img.height / rows);
    slices = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cv = document.createElement('canvas'); cv.width = sw; cv.height = sh;
        cv.getContext('2d').drawImage(src.img, c * sw, r * sh, sw, sh, 0, 0, sw, sh);
        slices.push({ canvas: cv, row: r, col: c });
      }
    }
    // Preview with grid overlay
    const pc = document.createElement('canvas'); pc.width = src.img.width; pc.height = src.img.height;
    const pctx = pc.getContext('2d'); pctx.drawImage(src.img, 0, 0);
    pctx.strokeStyle = '#fff'; pctx.lineWidth = 1; pctx.setLineDash([4, 4]);
    for (let r = 1; r < rows; r++) { pctx.beginPath(); pctx.moveTo(0, r * sh); pctx.lineTo(src.img.width, r * sh); pctx.stroke(); }
    for (let c = 1; c < cols; c++) { pctx.beginPath(); pctx.moveTo(c * sw, 0); pctx.lineTo(c * sw, src.img.height); pctx.stroke(); }
    $('gdprev').innerHTML = '<img src="' + pc.toDataURL() + '" style="max-width:100%;max-height:100%;object-fit:contain">';
    $('gdinfo').style.display = 'block';
    const estPer = Math.round(src.file.size / slices.length);
    $('gdinfo').textContent = rows + '\xd7' + cols + ' = ' + slices.length + ' 张 · 每张 ' + sw + '\xd7' + sh + ' · ~' + fmtSize(estPer) + '/张 · ~' + fmtSize(estPer * slices.length) + ' 总';
  };

  window._gdDownload = async () => {
    if (!slices.length) return toast('请先上传图片');
    saveToolSettings('t-grid');
    const fmt = $('gdfmt').value;
    for (const s of slices) {
      const b = await canvasToBlob(s.canvas, fmt, 1);
      const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '九宫格_' + (s.row + 1) + 'x' + (s.col + 1), fmt);
      download(b, fn);
      await sleep(120);
    }
    toast('已下载 ' + slices.length + ' 张');
  };

  window._gdZip = async () => {
    if (!slices.length) return toast('请先上传图片');
    if (typeof JSZip === 'undefined') return toast(window._jszipFailed ? 'JSZip 加载失败，请检查网络连接' : 'JSZip 加载中…');
    const zip = new JSZip(); const e = ext($('gdfmt').value);
    for (const s of slices) {
      const b = await canvasToBlob(s.canvas, $('gdfmt').value, 1);
      zip.file('slice_' + (s.row + 1) + 'x' + (s.col + 1) + '.' + e, b);
    }
    download(await zip.generateAsync({ type: 'blob' }), 'grid.zip');
    toast('ZIP 下载成功！');
  };
  window._gdQueue = async () => { if (!slices.length) return toast('请先上传图片'); saveToolSettings('t-grid'); const fmt = $('gdfmt').value; for (const s of slices) { const b = await canvasToBlob(s.canvas, fmt, 1); const fn = makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '九宫格_' + (s.row + 1) + 'x' + (s.col + 1), fmt); BatchQueue.add(b, fn, '九宫格'); } toast(`已添加 ${slices.length} 项到队列`); };
}

// STITCH
// ============================================================
function renderStitch() {
  let images = [], resultBlob = null, dir = 'h';
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="stupload" style="min-height:60px"><div class="ui">📦</div><div class="ut">拖拽或点击上传多张</div><div class="dh">📥 松开即可上传</div><input type="file" id="stinput" accept="image/*" multiple hidden></div>
        <div class="sect"><h3>预设</h3><div class="sect-body" id="stpreset"></div></div>
        <div class="sect"><h3>拼接方向</h3><div class="sect-body"><div class="pills" id="stdir">
          <button class="pill on" data-d="h">↔ 横向</button><button class="pill" data-d="v">↕ 纵向</button><button class="pill" data-d="g">⊞ 网格</button>
        </div>
        <div id="stcolgrp" class="irow hidden" style="margin-top:6px"><label>列数</label><input type="number" id="stcols" value="3" min="2" max="10" style="width:50px" onchange="window._stUpdate()"></div></div></div>
        <div class="sect"><h3>样式</h3><div class="sect-body">
          <div class="irow"><label>间距</label><input type="number" id="stgap" value="4" min="0" max="100" style="width:50px" onchange="window._stUpdate()"><label style="font-size:10px;color:var(--tx3)">px</label></div>
          <div class="irow"><label>背景色</label><input type="color" id="stbg" value="#ffffff" style="width:32px;height:28px;padding:1px" onchange="window._stUpdate()"></div>
          <div class="irow"><label>格式</label><select id="stfmt" onchange="window._stUpdate()"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></div>
        </div></div>
        <div class="btns" style="padding-top:0"><button class="btn btn2" style="font-size:10px;padding:4px 10px" onclick="window._stClear()">清空</button></div>
        <div class="blist" id="stlist"><div class="tac" style="color:var(--tx3);padding:24px">暂无图片</div></div>
        <div class="btns"><button class="btn btn1" onclick="window._stDownload()">💾 下载拼接图</button><button class="btn btn2" onclick="window._stQueue()">📥 添加到队列</button></div>
      </div>
      <div class="tool-r"><div class="prev" id="stprev"><div class="pe">等待上传…</div></div></div>
    </div>`;

  setupCollapse('v-tool');
  $('stpreset').innerHTML = renderPresetRow('t-stitch');
  restoreToolSettings('t-stitch');

  const sz = $('stupload'), si = $('stinput');
  sz.onclick = () => si.click();
  sz.ondragover = e => { e.preventDefault(); sz.classList.add('drag'); };
  sz.ondragleave = () => sz.classList.remove('drag');
  function addFiles(files) {
    [...files].forEach(f => {
      if (!f.type.startsWith('image/')) return;
      window._lastInput = { name: f.name, size: f.size };
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => { images.push({ img, name: f.name }); _stRender(); _stUpdate(); }; img.src = r.result; };
      r.readAsDataURL(f);
    });
  }
  sz.ondrop = e => { e.preventDefault(); sz.classList.remove('drag'); addFiles(e.dataTransfer.files); };
  si.onchange = () => { addFiles(si.files); };

  $('stdir').onclick = e => {
    const b = e.target.closest('.pill'); if (!b) return;
    dir = b.dataset.d;
    $('stdir').querySelectorAll('.pill').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('stcolgrp').classList.toggle('hidden', dir !== 'g');
    _stUpdate();
  };

  function _stRender() {
    if (!images.length) { $('stlist').innerHTML = '<div class="tac" style="color:var(--tx3);padding:24px">暂无图片</div>'; return; }
    $('stlist').innerHTML = images.map((im, i) => '<div class="bitem"><img src="' + im.img.src + '"><div class="bi"><div class="bn">' + im.name + '</div><div class="bs">' + im.img.width + '\xd7' + im.img.height + '</div></div><button class="btn btn2" style="font-size:10px;padding:2px 6px;flex-shrink:0" onclick="event.stopPropagation();window._stRemove(' + i + ')">✕</button></div>').join('');
  }
  window._stRemove = i => { images.splice(i, 1); _stRender(); _stUpdate(); };
  window._stClear = () => { images = []; resultBlob = null; _stRender(); _stUpdate(); };

  window._stUpdate = async () => {
    $('stprev').innerHTML = '<div class="pe">等待上传…</div>';
    if (!images.length) return;
    const gap = parseInt($('stgap').value) || 0;
    const bg = $('stbg').value, fmt = $('stfmt').value;
    const cols = parseInt($('stcols').value) || 3;
    let c;

    if (dir === 'h') {
      c = document.createElement('canvas');
      c.width = images.reduce((s, im) => s + im.img.width, 0) + gap * (images.length - 1);
      c.height = Math.max(...images.map(im => im.img.height));
      const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
      let x = 0;
      images.forEach(im => { ctx.drawImage(im.img, x, Math.round((c.height - im.img.height) / 2)); x += im.img.width + gap; });
    } else if (dir === 'v') {
      c = document.createElement('canvas');
      c.width = Math.max(...images.map(im => im.img.width));
      c.height = images.reduce((s, im) => s + im.img.height, 0) + gap * (images.length - 1);
      const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
      let y = 0;
      images.forEach(im => { ctx.drawImage(im.img, Math.round((c.width - im.img.width) / 2), y); y += im.img.height + gap; });
    } else {
      const rows = Math.ceil(images.length / cols);
      const cw = Math.max(...images.map(im => im.img.width));
      const ch = Math.max(...images.map(im => im.img.height));
      c = document.createElement('canvas');
      c.width = cw * cols + gap * (cols - 1);
      c.height = ch * rows + gap * (rows - 1);
      const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
      images.forEach((im, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        ctx.drawImage(im.img, col * (cw + gap) + Math.round((cw - im.img.width) / 2), row * (ch + gap) + Math.round((ch - im.img.height) / 2));
      });
    }
    resultBlob = await canvasToBlob(c, fmt, 0.95);
    $('stprev').innerHTML = '<div class="pl">' + images.length + ' 张 · ' + c.width + '\xd7' + c.height + ' · ' + fmtSize(resultBlob.size) + '</div><img src="' + URL.createObjectURL(resultBlob) + '">';
  };

  window._stDownload = () => {
    if (!resultBlob) return toast('请先上传图片');
    saveToolSettings('t-stitch');
    const fmt = $('stfmt').value;
    const baseName = images[0]?.name || 'stitched';
    const fn = makeFilename(Settings.getGlobal().filenamePattern, baseName, '图片拼接', fmt);
    download(resultBlob, fn); toast('下载成功！', 'suc');
  };
  window._stQueue = () => { if (!resultBlob) return toast('请先处理图片'); saveToolSettings('t-stitch'); const fmt = $('stfmt').value; const baseName = images[0]?.name || 'stitched'; const fn = makeFilename(Settings.getGlobal().filenamePattern, baseName, '图片拼接', fmt); BatchQueue.add(resultBlob, fn, '图片拼接'); };
}

function renderBorder() {

  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">

        </div></div></div>
        <div class="sect"><h3>参数</h3><div class="sect-body">
          <div id="bdBWGrp"><div class="slider"><div class="slid-l"><span>边框宽度</span><span id="bdbwv">4px</span></div><input type="range" id="bdbw" min="0" max="50" value="${ts.defaultBdWidth||g.defaultBdWidth||4}" oninput="_raf(window._bdUpdate)"></div></div>
          <div id="bdClrGrp"><div class="irow"><label>边框颜色</label><input type="color" id="bdbc" value="#ffffff" style="width:32px;height:28px;padding:1px" onchange="window._bdUpdate()"></div></div>
          <div id="bdRadGrp" class="hidden"><div class="slider"><div class="slid-l"><span>圆角</span><span id="bdrv">20px</span></div><input type="range" id="bdr" min="0" max="100" value="20" oninput="_raf(window._bdUpdate)"></div></div>
          <div id="bdShGrp" class="hidden"><div class="slider"><div class="slid-l"><span>阴影大小</span><span id="bdsv">12px</span></div><input type="range" id="bdsb" min="1" max="40" value="12" oninput="_raf(window._bdUpdate)"></div></div>
          <div id="bdPolGrp" class="hidden"><div class="slider"><div class="slid-l"><span>底部留白</span><span id="bdprv">25%</span></div><input type="range" id="bdpr" min="5" max="50" value="25" oninput="_raf(window._bdUpdate)"></div></div>
          <div class="irow" style="margin-top:4px"><label>背景色</label><input type="color" id="bdbg" value="#ffffff" style="width:32px;height:28px;padding:1px" onchange="window._bdUpdate()"></div>
          <div class="irow"><label>格式</label><select id="bdfmt" onchange="window._bdUpdate()"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._bdDownload()">💾 下载</button><button class="btn btn2" onclick="window._bdQueue()">📥 添加到队列</button></div>
      </div>
      <div class="tool-r"><div class="prev" id="bdprev"><div class="pe">等待上传…</div></div></div>
    </div>`;

  setupCollapse('v-tool');
  $('bdpreset').innerHTML = renderPresetRow('t-border');
  restoreToolSettings('t-border');
  setupDrop('bdupload', 'bdinput', async f => { src = await loadImg(f); showUpload('bdupload', src.dataUrl); _bdUpdate(); });

  $('bdmodes').onclick = e => {
    const b = e.target.closest('.mbtn'); if (!b) return;
    mode = b.dataset.m;
    $('bdmodes').querySelectorAll('.mbtn').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('bdBWGrp').classList.toggle('hidden', mode === 'shadow');
    $('bdClrGrp').classList.toggle('hidden', mode !== 'solid' && mode !== 'rounded');
    $('bdRadGrp').classList.toggle('hidden', mode !== 'rounded');
    $('bdShGrp').classList.toggle('hidden', mode !== 'shadow');
    $('bdPolGrp').classList.toggle('hidden', mode !== 'polaroid');
    _bdUpdate();
  };

  window._bdUpdate = async () => {
    if (!src) return;
    $('bdbwv').textContent = $('bdbw').value + 'px';
    $('bdrv').textContent = $('bdr').value + 'px';
    $('bdsv').textContent = $('bdsb').value + 'px';
    $('bdprv').textContent = $('bdpr').value + '%';
    const fmt = $('bdfmt').value, bg = $('bdbg').value || '#ffffff';
    const bw = parseInt($('bdbw').value) || 0, r = parseInt($('bdr').value) || 0;
    const sb = parseInt($('bdsb').value) || 0, pr = parseInt($('bdpr').value) / 100;

    const totalW = iw + pad * 2, totalH = ih + pad * 2 + bottomH;

    const canvas = document.createElement('canvas');
    canvas.width = totalW; canvas.height = totalH;
    const ctx = canvas.getContext('2d');

    if (mode === 'shadow') {
      ctx.fillStyle = bg; ctx.fillRect(0, 0, totalW, totalH);
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = sb; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = Math.round(sb * 0.25);
      ctx.fillStyle = bg; ctx.fillRect(pad - 4, pad - 4, iw + 8, ih + 8);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.drawImage(src.img, pad, pad);

      ctx.fillStyle = bg; ctx.fillRect(0, 0, totalW, totalH);

      // subtle shadow line at bottom of image
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(pad, pad + ih, iw, 2);
    } else if (mode === 'rounded') {
      ctx.fillStyle = bg;
      const rr = Math.min(r, totalW / 2, totalH / 2);
      ctx.beginPath(); ctx.moveTo(rr, 0); ctx.arcTo(totalW, 0, totalW, totalH, rr); ctx.arcTo(totalW, totalH, 0, totalH, rr); ctx.arcTo(0, totalH, 0, 0, rr); ctx.arcTo(0, 0, totalW, 0, rr);
      ctx.fill();
      if (bw > 0) { ctx.strokeStyle = $('bdbc').value; ctx.lineWidth = bw; ctx.stroke(); }
      ctx.save();
      ctx.beginPath(); ctx.moveTo(rr, 0); ctx.arcTo(totalW, 0, totalW, totalH, rr); ctx.arcTo(totalW, totalH, 0, totalH, rr); ctx.arcTo(0, totalH, 0, 0, rr); ctx.arcTo(0, 0, totalW, 0, rr); ctx.clip();
      ctx.drawImage(src.img, pad, pad);

    const bins = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
    for (let i = 0; i < d.length; i += 4) { bins[0][d[i]]++; bins[1][d[i + 1]]++; bins[2][d[i + 2]]++; }

    if (histMode === 'rgb') {
      let max = 1; for (let ci = 0; ci < 3; ci++) for (let x = 0; x < 256; x++) if (bins[ci][x] > max) max = bins[ci][x];
      ['#ef4444', '#10b981', '#3b82f6'].forEach((color, ci) => {
        hctx.fillStyle = color; hctx.globalAlpha = .45;
        const hist = bins[ci]; for (let x = 0; x < 256; x++) { const bh = hist[x] / max * hh; hctx.fillRect(x, hh - bh, 1, bh); }
      });
      hctx.globalAlpha = 1;
    }
    // LAB (V3.9): perceptual L* · a* green-red · b* blue-yellow
    if (histMode === 'lab') {
      const f = t => t > 0.008856 ? Math.cbrt(t) : t / 0.026569 + 0.137931;
      const labBins = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      for (let i = 0; i < d.length; i += 4) {
        let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        r = r > 0.04045 ? ((r + 0.055) / 1.055) ** 2.4 : r / 12.92;
        g = g > 0.04045 ? ((g + 0.055) / 1.055) ** 2.4 : g / 12.92;
        b = b > 0.04045 ? ((b + 0.055) / 1.055) ** 2.4 : b / 12.92;
        const X = 0.4124 * r + 0.3576 * g + 0.1805 * b;
        const Y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const Z = 0.0193 * r + 0.1192 * g + 0.9505 * b;
        const fx = f(X / 0.95047), fy = f(Y), fz = f(Z / 1.08883);
        const L = 116 * fy - 16, A = 500 * (fx - fy), B = 200 * (fy - fz);
        labBins[0][Math.max(0, Math.min(255, Math.round(L * 2.55)))]++;
        labBins[1][Math.max(0, Math.min(255, Math.round(A + 128)))]++;
        labBins[2][Math.max(0, Math.min(255, Math.round(B + 128)))]++;
      }
      let lmax = 1; for (let ci = 0; ci < 3; ci++) for (let x = 0; x < 256; x++) if (labBins[ci][x] > lmax) lmax = labBins[ci][x];
      // L* gray bars
      hctx.fillStyle = '#9ca3af'; hctx.globalAlpha = .5;
      for (let x = 0; x < 256; x++) { const bh = labBins[0][x] / lmax * hh; hctx.fillRect(x, hh - bh, 1, bh); }
      // a* green bars
      hctx.fillStyle = '#10b981'; hctx.globalAlpha = .4;
      for (let x = 0; x < 256; x++) { const bh = labBins[1][x] / lmax * hh; hctx.fillRect(x, hh - bh, 1, bh); }
      // b* blue bars
      hctx.fillStyle = '#3b82f6'; hctx.globalAlpha = .4;
      for (let x = 0; x < 256; x++) { const bh = labBins[2][x] / lmax * hh; hctx.fillRect(x, hh - bh, 1, bh); }
      // L* curve overlay
      hctx.strokeStyle = '#fff'; hctx.lineWidth = 1.5; hctx.globalAlpha = .8; hctx.beginPath();
      for (let x = 0; x < 256; x++) { const bh = labBins[0][x] / lmax * hh; x === 0 ? hctx.moveTo(x, hh - bh) : hctx.lineTo(x + .5, hh - bh); }
      hctx.stroke(); hctx.globalAlpha = 1;
      return; // LAB draws its own curve, skip luminance section below
    }
    // Luminance
    const lum = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) { const l = Math.round(.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]); lum[l]++; }
    let lmax = 1; for (let x = 0; x < 256; x++) if (lum[x] > lmax) lmax = lum[x];
    if (histMode === 'lum') {
      hctx.fillStyle = '#fff'; hctx.globalAlpha = .55;
      for (let x = 0; x < 256; x++) { const bh = lum[x] / lmax * hh; hctx.fillRect(x, hh - bh, 1, bh); }
    }
    hctx.strokeStyle = '#fff'; hctx.lineWidth = 1.5; hctx.globalAlpha = histMode === 'rgb' ? .7 : 1; hctx.beginPath();
    for (let x = 0; x < 256; x++) { const bh = lum[x] / lmax * hh; x === 0 ? hctx.moveTo(x, hh - bh) : hctx.lineTo(x + .5, hh - bh); }
    hctx.stroke(); hctx.globalAlpha = 1;
  };
  // Auto-enhance: analyze image → stretch histogram → boost saturation
  window._ftAutoEnhance = () => {
    if (!src) return toast('请先上传图片');
    const canvas = document.createElement('canvas');
    canvas.width = src.img.width; canvas.height = src.img.height;
    const ctx = canvas.getContext('2d'); ctx.drawImage(src.img, 0, 0);
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height), d = id.data;
    // Find per-channel percentiles
    let minR = 255, maxR = 0, minG = 255, maxG = 0, minB = 255, maxB = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] < minR) minR = d[i]; if (d[i] > maxR) maxR = d[i];
      if (d[i+1] < minG) minG = d[i+1]; if (d[i+1] > maxG) maxG = d[i+1];
      if (d[i+2] < minB) minB = d[i+2]; if (d[i+2] > maxB) maxB = d[i+2];
    }
    // Stretch to full range
    const sR = maxR > minR ? 255 / (maxR - minR) : 1;
    const sG = maxG > minG ? 255 / (maxG - minG) : 1;
    const sB = maxB > minB ? 255 / (maxB - minB) : 1;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = Math.min(255, Math.max(0, (d[i] - minR) * sR));
      d[i+1] = Math.min(255, Math.max(0, (d[i+1] - minG) * sG));
      d[i+2] = Math.min(255, Math.max(0, (d[i+2] - minB) * sB));
    }
    ctx.putImageData(id, 0, 0);
    // Update output and show preview directly
    window._ftHistData = d;
    canvasToBlob(canvas, $('ftfmt').value, 0.92).then(b => {
      out = b; const url = URL.createObjectURL(out);
      $('ftprev').innerHTML = ''; _renderCompare(src.dataUrl, url, 'ftprev', ['原图','增强']);
      $('ftinfo').style.display = 'grid'; $('fti2').textContent = `${$('ftfmt').value.split('/')[1].toUpperCase()} · ${src.img.width}×${src.img.height} · ${fmtSize(out.size)}`;
      _ftDrawHist();
      // Reset sliders to neutral since we applied direct enhancement
      $('ftb').value = 0; $('ftc').value = 0; $('fts').value = 0; $('ftw').value = 0; $('ftk').value = 0;
      $('ftbv').textContent = '0'; $('ftcv').textContent = '0'; $('ftsv').textContent = '0'; $('ftwv').textContent = '0'; $('ftkv').textContent = '0';
      toast('已自动增强！');
    });
  };
  window._ftDownload = () => { if (out) { saveToolSettings('t-filter'); download(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '滤镜调整', $('ftfmt').value)); toast('下载成功！', 'suc'); } else toast('请先上传图片'); };
  window._ftCopy = () => { if (out) copyImg(out); else toast('请先上传图片'); };
  window._ftQueue = () => { if (out) { saveToolSettings('t-filter'); BatchQueue.add(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '滤镜调整', $('ftfmt').value), '滤镜调整'); } else toast('请先处理图片'); };
}

// CURVES
// ============================================================
function renderCurves() {
  let src = null, out = null, channel = 'rgb';
  let points = [{x:0,y:0},{x:64,y:64},{x:192,y:191},{x:255,y:255}]; // image space (0-255)

  const _cvLUT = () => {
    const sorted = [...points].sort((a,b)=>a.x-b.x);
    const lut = new Uint8Array(256);
    let j = 0;
    for (let x = 0; x < 256; x++) {
      while (j < sorted.length - 2 && sorted[j+1].x < x) j++;
      const a = sorted[j], b = sorted[j+1];
      if (a.x >= b.x) { lut[x] = a.y; continue; }
      lut[x] = Math.round(a.y + (x - a.x) / (b.x - a.x) * (b.y - a.y));
    }
    return lut;
  };

  const _cvDraw = () => {
    const c = $('cvc'), w = 256, h = 256;
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    // Histogram background
    if (src) {
      const tc = document.createElement('canvas');
      tc.width = src.img.width; tc.height = src.img.height;
      const tctx = tc.getContext('2d'); tctx.drawImage(src.img, 0, 0);
      const d = tctx.getImageData(0, 0, tc.width, tc.height).data;
      const bins = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      for (let i = 0; i < d.length; i += 4) { bins[0][d[i]]++; bins[1][d[i+1]]++; bins[2][d[i+2]]++; }
      let mx = 1; for (let ci = 0; ci < 3; ci++) for (let x = 0; x < 256; x++) if (bins[ci][x] > mx) mx = bins[ci][x];
      const chs = channel === 'r' ? [0] : channel === 'g' ? [1] : channel === 'b' ? [2] : [0, 1, 2];
      const cols = ['#ef4444', '#10b981', '#3b82f6'];
      chs.forEach(ci => {
        ctx.fillStyle = cols[ci]; ctx.globalAlpha = 0.3;
        for (let x = 0; x < 256; x++) { const bh = bins[ci][x] / mx * h; ctx.fillRect(x, h - bh, 1, bh); }
      });
      ctx.globalAlpha = 1;
    }

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 0.5;
    for (let i = 1; i < 4; i++) {
      const v = i * 64;
      ctx.beginPath(); ctx.moveTo(v, 0); ctx.lineTo(v, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, v); ctx.lineTo(w, v); ctx.stroke();
    }

    // Diagonal reference
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 0.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(w, 0); ctx.stroke(); ctx.setLineDash([]);

    // Curve (piecewise linear)
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    const sorted = [...points].sort((a,b)=>a.x-b.x);
    for (let x = 0; x <= 255; x++) {
      let j = sorted.length - 2;
      for (let k = 0; k < sorted.length - 1; k++) { if (sorted[k+1].x >= x) { j = k; break; } }
      const a = sorted[j], b = sorted[j+1];
      let y;
      if (b.x <= a.x) y = a.y;
      else y = a.y + (x - a.x) / (b.x - a.x) * (b.y - a.y);
      const cy = h - y / 255 * h;
      x === 0 ? ctx.moveTo(x, cy) : ctx.lineTo(x, cy);
    }
    ctx.stroke();

    // Control points
    points.forEach((p, i) => {
      const px = p.x / 255 * w, py = h - p.y / 255 * h;
      const isEnd = i === 0 || (points.length > 1 && i === points.length - 1);
      ctx.fillStyle = isEnd ? getComputedStyle(document.documentElement).getPropertyValue('--ac').trim() : '#fff';
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  };

  const _cvApply = () => {
    if (!src) return;
    const lut = _cvLUT();
    const canvas = document.createElement('canvas');
    canvas.width = src.img.width; canvas.height = src.img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(src.img, 0, 0);
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    const mask = channel === 'r' ? [1,0,0] : channel === 'g' ? [0,1,0] : channel === 'b' ? [0,0,1] : [1,1,1];
    for (let i = 0; i < d.length; i += 4) {
      if (mask[0]) d[i] = lut[d[i]];
      if (mask[1]) d[i+1] = lut[d[i+1]];
      if (mask[2]) d[i+2] = lut[d[i+2]];
    }
    ctx.putImageData(id, 0, 0);
    canvasToBlob(canvas, 'image/png', 1).then(b => {
      out = b;
      $('crvout').textContent = '输出：' + fmtSize(b.size);
      $('crvprev').innerHTML = ''; _renderCompare(src.dataUrl, URL.createObjectURL(out), 'crvprev', ['原图','曲线']);
    });
  };

  const _cvMouse = (e) => {
    const c = $('cvc'), rect = c.getBoundingClientRect();
    const mx = Math.round((e.clientX - rect.left) / rect.width * 255);
    const my = Math.round(255 - (e.clientY - rect.top) / rect.height * 255);
    return { x: Math.max(0, Math.min(255, mx)), y: Math.max(0, Math.min(255, my)) };
  };

  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="crvupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传图片</div><div class="dh">📥 松开即可上传</div><input type="file" id="crvinput" accept="image/*" hidden></div>
        ${renderPresetRow('t-curves')}
        <div class="sect"><h3>通道</h3><div class="sect-body">
          <div class="pills" id="crvch"><button class="pill on" data-ch="rgb">🌈 RGB</button><button class="pill" data-ch="r" style="color:#ef4444">🔴 R</button><button class="pill" data-ch="g" style="color:#10b981">🟢 G</button><button class="pill" data-ch="b" style="color:#3b82f6">🔵 B</button></div>
        </div></div>
        <div class="sect"><h3>曲线</h3><div class="sect-body" style="text-align:center">
          <canvas id="cvc" width="256" height="256" style="width:256px;height:256px;border:1px solid var(--bd);border-radius:var(--rs);cursor:crosshair;background:#111" onmousedown="window._cvDown(event)" ondblclick="window._cvDbl(event)"></canvas>
          <div style="font-size:10px;color:var(--tx3);margin-top:4px">拖拽节点 · 双击添加 · 右键删除</div>
        </div></div>
        <div class="sect"><h3>预设</h3><div class="sect-body"><div class="pills" id="crvpresets">
          <button class="pill" onclick="window._cvPreset('linear')">📏 线性</button>
          <button class="pill" onclick="window._cvPreset('lighter')">☀️ 提亮</button>
          <button class="pill" onclick="window._cvPreset('darker')">🌙 压暗</button>
          <button class="pill" onclick="window._cvPreset('sCurve')">🔄 S曲线</button>
          <button class="pill" onclick="window._cvPreset('crush')">🎬 胶片暗部</button>
          <button class="pill" onclick="window._cvPreset('fade')">🌫️ 褪色</button>
          <button class="pill" onclick="window._cvPreset('punch')">💪 高对比</button>
          <button class="pill" onclick="window._cvPreset('invert')">🔃 反相</button>
        </div></div></div>
        <div class="btns"><button class="btn btn1" onclick="window._cvApply()">🔄 应用曲线</button><button class="btn btn2" onclick="window._cvReset()">↩ 重置</button></div>
        <div style="font-size:11px;color:var(--tx2);margin-top:4px" id="crvout">输出：-</div>
      </div>
      <div class="tool-r"><div class="prev" id="crvprev"><div class="pe">📈 上传图片后编辑曲线</div></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn btn2" style="font-size:11px;padding:6px 12px" onclick="window._crvDownload()">💾 下载</button>
          <button class="btn btn2" style="font-size:11px;padding:6px 12px" onclick="window._crvCopy()">📋 复制</button>
          <button class="btn btn2" style="font-size:11px;padding:6px 12px" onclick="window._crvQueue()">📥 添加到队列</button>
        </div>
      </div>
    </div>`;

  // Channel switch
  $('crvch').onclick = e => {
    const btn = e.target.closest('button[data-ch]');
    if (!btn) return;
    $('crvch').querySelectorAll('.pill').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    channel = btn.dataset.ch;
    _cvDraw();
  };

  // Curve mouse events
  window._cvDown = e => {
    const p = _cvMouse(e);
    const idx = points.findIndex(pt => Math.abs(pt.x - p.x) <= 8 && Math.abs(pt.y - p.y) <= 8);
    if (e.button === 2) { // right-click: delete
      if (idx > 0 && idx < points.length - 1 && points.length > 2) {
        points.splice(idx, 1); _cvDraw(); _cvApply();
      }
      return;
    }
    if (idx >= 0) {
      const move = ev => {
        const mp = _cvMouse(ev);
        if (idx === 0) mp.x = 0;
        if (idx === points.length - 1) mp.x = 255;
        points[idx].x = mp.x; points[idx].y = mp.y;
        _cvDraw();
      };
      const up = () => { _cvApply(); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    }
  };
  window._cvDbl = e => {
    const p = _cvMouse(e);
    if (!points.some(pt => Math.abs(pt.x - p.x) <= 10 && Math.abs(pt.y - p.y) <= 10)) {
      points.push(p);
      _cvDraw(); _cvApply();
    }
  };
  $('cvc').oncontextmenu = e => e.preventDefault();

  window._cvPreset = name => {
    const presets = {
      linear: [{x:0,y:0},{x:255,y:255}],
      lighter: [{x:0,y:64},{x:128,y:191},{x:255,y:255}],
      darker: [{x:0,y:0},{x:128,y:64},{x:255,y:191}],
      sCurve: [{x:0,y:0},{x:96,y:48},{x:160,y:207},{x:255,y:255}],
      crush: [{x:0,y:0},{x:64,y:20},{x:192,y:235},{x:255,y:255}],
      fade: [{x:0,y:30},{x:64,y:80},{x:192,y:200},{x:255,y:230}],
      punch: [{x:0,y:0},{x:80,y:30},{x:175,y:225},{x:255,y:255}],
      invert: [{x:0,y:255},{x:255,y:0}],
    };
    points = presets[name] || presets.linear;
    _cvDraw(); _cvApply();
  };
  window._cvReset = () => { points = [{x:0,y:0},{x:255,y:255}]; _cvDraw(); _cvApply(); };

  // Actions
  window._crvDownload = () => { if (out) { saveToolSettings('t-curves'); download(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '曲线调整', 'image/png')); toast('下载成功！', 'suc'); } else toast('请先应用曲线'); };
  window._crvCopy = () => { if (out) copyImg(out); else toast('请先应用曲线'); };
  window._crvQueue = () => { if (out) { saveToolSettings('t-curves'); BatchQueue.add(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '曲线调整', 'image/png'), '曲线调整'); } else toast('请先应用曲线'); };

  setupCollapse('v-tool');
  setupDrop('crvupload', 'crvinput', async f => { src = await loadImg(f); out = null; points = [{x:0,y:0},{x:255,y:255}]; showUpload('crvupload', src.dataUrl); _cvDraw(); _cvApply(); });
  _cvDraw();
}

function renderColorPick() {
  let src = null, lastColors = [];
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="pkupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传图片</div><div class="dh">📥 松开即可上传</div><input type="file" id="pkinput" accept="image/*" hidden></div>
        <div class="sect"><h3>取色结果</h3><div class="sect-body">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">

          </div>

          <div id="pkHistory" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px"></div>
        </div></div>
      </div>

          <canvas id="pkCanvas" style="display:block;image-rendering:pixelated"></canvas>
          <div id="pkLens" style="position:absolute;width:80px;height:80px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.4);pointer-events:none;display:none;overflow:hidden;transform:translate(-50%,-50%)">
            <canvas id="pkLensCanvas" width="80" height="80" style="image-rendering:pixelated;width:80px;height:80px"></canvas>
          </div>
        </div>
      </div>
    </div>`;

  setupCollapse('v-tool');
  setupDrop('pkupload', 'pkinput', async f => {
    src = await loadImg(f); showUpload('pkupload', src.dataUrl);
    _pkRender();
  });

  window._pkRender = () => {
    if (!src) return;
    const z = parseInt($('pkZoom').value) || 2;
    const c = $('pkCanvas'), wrap = $('pkView');
    const maxW = Math.min(600, wrap.clientWidth - 16);
    c.width = src.img.width; c.height = src.img.height;
    c.style.width = (src.img.width * z) + 'px';
    c.style.height = (src.img.height * z) + 'px';
    c.getContext('2d').drawImage(src.img, 0, 0);
  };

  $('pkCanvas').onmousemove = e => {
    if (!src) return;
    const c = $('pkCanvas');
    const rect = c.getBoundingClientRect();
    const sx = c.width / rect.width, sy = c.height / rect.height;
    const x = Math.floor((e.clientX - rect.left) * sx), y = Math.floor((e.clientY - rect.top) * sy);
    if (x < 0 || y < 0 || x >= c.width || y >= c.height) return;

    const px = c.getContext('2d').getImageData(x, y, 1, 1).data;
    const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    const r = px[0], g = px[1], b = px[2];
    const h = () => { const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn; if (!d) return 0; const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return Math.round(h * 60); };
    const l = () => Math.round((Math.max(r,g,b) + Math.min(r,g,b)) / 2 / 2.55) / 100;
    const s = () => { const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn; return d ? Math.round(d / (255 - Math.abs(2 * (mx + mn) / 2 - 255)) * 100) : 0; };

    $('pkSwatch').style.background = hex;
    $('pkHex').textContent = hex.toUpperCase();
    $('pkRgb').textContent = `(${r}, ${g}, ${b})`;
    $('pkHsl').textContent = `${h()}°, ${s()}%, ${Math.round(l()*100)}%`;

    // Lens
    const lens = $('pkLens'), lc = $('pkLensCanvas');
    lens.style.display = 'block'; lens.style.left = (e.clientX - rect.left) + 'px'; lens.style.top = (e.clientY - rect.top) + 'px';
    const lctx = lc.getContext('2d');
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(c, x - 20, y - 20, 40, 40, 0, 0, 80, 80);
    // Crosshair
    lctx.strokeStyle = '#fff'; lctx.lineWidth = 1;
    lctx.beginPath(); lctx.moveTo(40, 0); lctx.lineTo(40, 80); lctx.moveTo(0, 40); lctx.lineTo(80, 40); lctx.stroke();
  };
  $('pkCanvas').onmouseleave = () => { $('pkLens').style.display = 'none'; };
  $('pkCanvas').onclick = () => {
    const hex = $('pkHex').textContent;
    if (!hex || hex === '-') return;
    lastColors = lastColors.filter(c => c !== hex);
    lastColors.unshift(hex);
    if (lastColors.length > 10) lastColors.length = 10;
    $('pkHistory').innerHTML = lastColors.map(c =>
      `<div style="width:24px;height:24px;border-radius:4px;background:${c};border:1px solid var(--bd);cursor:pointer;flex-shrink:0" title="${c}" onclick="navigator.clipboard.writeText('${c}').then(()=>toast('已复制 ${c}'))"></div>`
    ).join('');
    toast('已取色：' + hex.toUpperCase());
  };
}

function renderBlur() {
  let src = null, blurCanvas = null, painting = false;
  $('v-tool').innerHTML = `
    <div class="tool">
      <div class="tool-l">
        <div class="upload" id="blupload"><div class="ui">📤</div><div class="ut">拖拽或点击上传图片</div><div class="dh">📥 松开即可上传</div><input type="file" id="blinput" accept="image/*" hidden></div>
        <div class="sect"><h3>预设</h3><div class="sect-body" id="blpreset"></div></div>
        <div class="sect"><h3>画笔</h3><div class="sect-body">
          <div class="slider"><div class="slid-l"><span>画笔大小</span><span id="blszv">30</span></div><input type="range" id="blsz" min="5" max="80" value="30" oninput="$('blszv').textContent=this.value"></div>
          <div class="slider"><div class="slid-l"><span>强度</span><span id="blstv">4</span></div><input type="range" id="blst" min="2" max="15" value="4" oninput="$('blstv').textContent=this.value"></div>
          <div style="font-size:10px;color:var(--tx3);margin-top:4px">💡 在图片上拖动鼠标涂抹模糊区域</div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._blDownload()">💾 下载</button><button class="btn btn2" onclick="window._blReset()">🔄 重置</button><button class="btn btn2" onclick="window._blQueue()">📥 添加到队列</button></div>
        <div style="font-size:11px;color:var(--tx2);margin-top:4px" id="blout">输出：-</div>
      </div>
      <div class="tool-r"><div class="prev" style="padding:0;overflow:auto;background:var(--inp)"><canvas id="blCanvas" style="display:block;max-width:100%;cursor:crosshair"></canvas></div></div>
    </div>`;

  setupCollapse('v-tool');
  $('blpreset').innerHTML = renderPresetRow('t-blur');
  restoreToolSettings('t-blur');
  setupDrop('blupload', 'blinput', async f => {
    src = await loadImg(f); showUpload('blupload', src.dataUrl);
    blurCanvas = $('blCanvas');
    const maxW = Math.min(600, $('v-tool').querySelector('.tool-r').clientWidth - 32);
    const s = Math.min(1, maxW / src.img.width);
    blurCanvas.width = src.img.width * s; blurCanvas.height = src.img.height * s;
    blurCanvas.getContext('2d').drawImage(src.img, 0, 0, blurCanvas.width, blurCanvas.height);
  });

  function _blGetPos(e) {
    const ev = e.touches ? e.touches[0] : e;
    const rect = blurCanvas.getBoundingClientRect();
    return { x: (ev.clientX - rect.left) * blurCanvas.width / rect.width, y: (ev.clientY - rect.top) * blurCanvas.height / rect.height };
  }

  blurCanvas = $('blCanvas'); // placeholder, reassigned on upload
  $('blCanvas').onmousedown = e => { painting = true; _blPaint(_blGetPos(e)); e.preventDefault(); };
  $('blCanvas').onmousemove = e => { if (painting) _blPaint(_blGetPos(e)); };
  $('blCanvas').ontouchstart = e => { painting = true; _blPaint(_blGetPos(e)); e.preventDefault(); };
  $('blCanvas').ontouchmove = e => { if (painting) _blPaint(_blGetPos(e)); e.preventDefault(); };
  document.removeEventListener('mouseup', window._blMouseUp);
  document.removeEventListener('touchend', window._blMouseUp);
  window._blMouseUp = () => { painting = false; };
  document.addEventListener('mouseup', window._blMouseUp);
  document.addEventListener('touchend', window._blMouseUp);

  function _blPaint(pos) {
    const c = $('blCanvas');
    const r = parseInt($('blsz').value), st = parseInt($('blst').value);
    const ctx = c.getContext('2d');
    const sx = Math.max(0, pos.x - r), sy = Math.max(0, pos.y - r);
    const sw = Math.min(r * 2, c.width - sx), sh = Math.min(r * 2, c.height - sy);
    if (sw <= 0 || sh <= 0) return;
    const small = Math.max(2, Math.floor(Math.min(sw, sh) / st));
    const off = document.createElement('canvas'); off.width = small; off.height = small;
    off.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, small, small);
    ctx.save(); ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, sx, sy, sw, sh);
    ctx.imageSmoothingEnabled = true;
    ctx.restore();
  }

  window._blReset = () => {
    if (!src) return;
    const c = $('blCanvas');
    c.getContext('2d').drawImage(src.img, 0, 0, c.width, c.height);
    toast('已重置');
  };
  window._blDownload = () => {
    if (!src) return toast('请先上传图片');
    $('blCanvas').toBlob(blob => {
      $('blout').textContent = '输出：' + $('blCanvas').width + '\xd7' + $('blCanvas').height + ' · ' + fmtSize(blob.size);
      saveToolSettings('t-blur');
      download(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '局部模糊', 'image/png'));
      toast('下载成功！', 'suc');
    }, 'image/png');
  };
  window._blQueue = () => {
    if (!src) return toast('请先处理图片');
    $('blCanvas').toBlob(blob => {
      saveToolSettings('t-blur');
      BatchQueue.add(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '局部模糊', 'image/png'), '局部模糊');
    }, 'image/png');
  };
}

  $('v-tool').innerHTML = `

            <div class="irow"><label>字体</label><select id="wmff" onchange="window._wmUpdate()"><option value="sans-serif">无衬线</option><option value="serif">衬线</option><option value="monospace">等宽</option><option value="'KaiTi','STKaiti'">楷体</option></select></div>
          </div>
          <div id="wmImgGrp" class="hidden">
            <div style="margin-bottom:6px"><button class="btn btn2" style="font-size:10px;padding:4px 10px;width:100%" onclick="document.getElementById('wmimginput').click()">📤 上传水印图片</button><input type="file" id="wmimginput" accept="image/*" hidden></div>
            <div class="slider"><div class="slid-l"><span>水印大小</span><span id="wmwsv">20%</span></div><input type="range" id="wmws" min="5" max="100" value="20" oninput="_raf(window._wmUpdate)"></div>
          </div>
          <div class="slider"><div class="slid-l"><span>不透明度</span><span id="wmopv">40%</span></div><input type="range" id="wmop" min="5" max="100" value="40" oninput="_raf(window._wmUpdate)"></div>
          <div class="irow"><label>颜色</label><input type="color" id="wmc" value="#ffffff" style="width:32px;height:28px;padding:1px" onchange="window._wmUpdate()"></div>
          <div class="slider"><div class="slid-l"><span>旋转</span><span id="wmrv">0°</span></div><input type="range" id="wmr" min="-90" max="90" value="0" oninput="_raf(window._wmUpdate)"></div>
          <div style="font-size:10px;color:var(--tx3);margin-bottom:4px">位置</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px" id="wmPos">
            ${['↖','↑','↗','←','⊙','→','↙','↓','↘'].map((a,i) => `<button class="pill${i===4?' on':''}" data-p="${i}" style="font-size:14px;padding:4px">${a}</button>`).join('')}
          </div>
        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._wmDownload()">💾 下载</button><button class="btn btn2" onclick="window._wmQueue()">📥 添加到队列</button></div>
      </div>
      <div class="tool-r"><div class="prev" id="wmprev"><div class="pe">等待上传…</div></div></div>
    </div>`;

  setupCollapse('v-tool');
  $('wmpreset').innerHTML = renderPresetRow('t-watermark');
  restoreToolSettings('t-watermark');
  setupDrop('wmupload', 'wminput', async f => { src = await loadImg(f); showUpload('wmupload', src.dataUrl); _wmUpdate(); });

  document.getElementById('wmimginput').onchange = async e => {
    const f = e.target.files[0];
    if (f) { wmImg = await loadImg(f); _wmUpdate(); }
  };

  $('wmmodes').onclick = e => {
    const b = e.target.closest('.mbtn'); if (!b) return;
    mode = b.dataset.m;
    $('wmmodes').querySelectorAll('.mbtn').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('wmTextGrp').classList.toggle('hidden', mode !== 'text');
    $('wmImgGrp').classList.toggle('hidden', mode !== 'image');
    _wmUpdate();
  };
  $('wmPos').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; $('wmPos').querySelectorAll('.pill').forEach(x => x.classList.remove('on')); b.classList.add('on'); _wmUpdate(); };

  window._wmUpdate = async () => {
    if (!src) return;
    $('wmopv').textContent = $('wmop').value + '%';
    $('wmrv').textContent = $('wmr').value + '°';
    $('wmwsv').textContent = $('wmws').value + '%';
    const opacity = parseInt($('wmop').value) / 100;
    const color = $('wmc').value || '#ffffff';
    const rotation = parseInt($('wmr').value) * Math.PI / 180;
    const posIdx = parseInt($('wmPos').querySelector('.pill.on')?.dataset.p || '4');

    const canvas = document.createElement('canvas');
    canvas.width = src.img.width; canvas.height = src.img.height;
    const ctx = canvas.getContext('2d'); ctx.drawImage(src.img, 0, 0);
    ctx.globalAlpha = opacity;

    let wmW = 0, wmH = 0;
    if (mode === 'text') {
      const txt = $('wmtxt').value || '©';
      const fs = parseInt($('wmfs').value) || 32;
      const ff = $('wmff').value || 'sans-serif';
      ctx.font = fs + 'px ' + ff; ctx.fillStyle = color;
      const m = ctx.measureText(txt);
      wmW = m.width; wmH = fs;
    } else if (wmImg) {
      const pct = parseInt($('wmws').value) / 100;
      wmW = src.img.width * pct; wmH = wmImg.img.height * wmW / wmImg.img.width;
    } else {
      ctx.globalAlpha = 1; out = await canvasToBlob(canvas, 'image/png', 1);
      $('wmprev').innerHTML = `<div class="pl">${src.img.width}×${src.img.height} · ${fmtSize(out.size)}</div><img src="${URL.createObjectURL(out)}">`;
      return;
    }

    // Position: 0=TL 1=TC 2=TR 3=ML 4=C 5=MR 6=BL 7=BC 8=BR
    const col = posIdx % 3, row = Math.floor(posIdx / 3);
    const margin = 20;
    const x = col === 0 ? margin : col === 1 ? (canvas.width - wmW) / 2 : canvas.width - wmW - margin;
    const y = row === 0 ? margin + wmH : row === 1 ? (canvas.height + wmH) / 2 : canvas.height - margin;

    ctx.save(); ctx.translate(x + wmW / 2, y - wmH / 2); ctx.rotate(rotation);
    if (mode === 'text') {
      const txt = $('wmtxt').value || '©';
      const fs = parseInt($('wmfs').value) || 32;
      const ff = $('wmff').value || 'sans-serif';
      ctx.font = fs + 'px ' + ff; ctx.fillStyle = color;
      ctx.fillText(txt, -wmW / 2, wmH / 2);
    } else if (wmImg) {
      ctx.drawImage(wmImg.img, -wmW / 2, -wmH / 2, wmW, wmH);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    out = await canvasToBlob(canvas, 'image/png', 1);
    $('wmprev').innerHTML = `<div class="pl">${src.img.width}×${src.img.height} · ${fmtSize(out.size)}</div><img src="${URL.createObjectURL(out)}">`;
  };
  window._wmDownload = () => { if (out) { saveToolSettings('t-watermark'); download(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '添加水印', 'image/png')); toast('下载成功！', 'suc'); } else toast('请先上传图片'); };
  window._wmQueue = () => { if (out) { saveToolSettings('t-watermark'); BatchQueue.add(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '添加水印', 'image/png'), '添加水印'); } else toast('请先处理图片'); };
}

        </div></div>
        <div class="btns"><button class="btn btn1" onclick="window._idDownload()">💾 下载</button><button class="btn btn2" onclick="window._idQueue()">📥 添加到队列</button></div>
        <div style="font-size:10px;color:var(--tx3);padding:4px 0">💡 在预览图上拖动以调整裁剪位置</div>
      </div>
      <div class="tool-r"><div class="prev" style="padding:0;overflow:hidden;background:var(--inp)" id="idView"><canvas id="idCanvas" style="display:block;cursor:move"></canvas></div><div class="infog" id="idinfo" style="display:none;padding:8px;flex-shrink:0"><div class="info"><span class="il">原图</span><span class="iv" id="idi1">-</span></div><div class="info"><span class="il">输出</span><span class="iv" id="idi2">-</span></div></div></div>
    </div>`;

  preset = PRESETS[0];
  setupCollapse('v-tool');
  $('idpreset').innerHTML = renderPresetRow('t-idphoto');
  restoreToolSettings('t-idphoto');
  setupDrop('idupload', 'idinput', async f => { src = await loadImg(f); showUpload('idupload', src.dataUrl); cx = 0.5; cy = 0.5; $('idinfo').style.display = 'grid'; $('idi1').textContent = src.img.width + '\xd7' + src.img.height + ' · ' + fmtSize(f.size); _idRender(); });

  $('idpills').onclick = e => {
    const b = e.target.closest('.pill'); if (!b) return;
    $('idpills').querySelectorAll('.pill').forEach(x => x.classList.remove('on')); b.classList.add('on');
    const idx = parseInt(b.dataset.idx);
    if (idx === PRESETS.length) { $('idCustomGrp').classList.remove('hidden'); preset = { w: parseInt($('idcw').value)||300, h: parseInt($('idch').value)||400, px: true }; }
    else { $('idCustomGrp').classList.add('hidden'); preset = PRESETS[idx]; }
    _idRender();
  };

  window._idUpdate = () => {
    const dpi = parseInt($('iddpi').value) || 300;
    PRESETS.forEach((p, i) => { const el = $('idpx' + i); if (el) el.textContent = Math.round(p.mw / 25.4 * dpi) + '×' + Math.round(p.mh / 25.4 * dpi) + 'px'; });
    if ($('idpills').querySelector('.pill.on')?.dataset.idx === String(PRESETS.length)) {
      preset = { w: parseInt($('idcw').value)||300, h: parseInt($('idch').value)||400, px: true };
    }
    _idRender();
  };

  window._idRender = () => {
    if (!src || !preset) return;
    const c = $('idCanvas'), wrap = $('idView');
    const maxW = Math.min(560, wrap.clientWidth - 16);
    const ds = Math.min(1, maxW / src.img.width);
    c.width = src.img.width * ds; c.height = src.img.height * ds;
    c.style.width = c.width + 'px'; c.style.height = c.height + 'px';

    const px = _idPx();
    const ratio = px.w / px.h;
    let cw, ch;
    if (src.img.width / src.img.height > ratio) { ch = src.img.height; cw = src.img.height * ratio; }
    else { cw = src.img.width; ch = src.img.width / ratio; }
    const cropX = Math.max(0, Math.min(src.img.width - cw, cx * src.img.width - cw / 2));
    const cropY = Math.max(0, Math.min(src.img.height - ch, cy * src.img.height - ch / 2));
    const [dx, dy, dw, dh] = [cropX * ds, cropY * ds, cw * ds, ch * ds];

    const ctx = c.getContext('2d');
    ctx.drawImage(src.img, 0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.clearRect(dx, dy, dw, dh);
    ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
    ctx.drawImage(src.img, 0, 0, c.width, c.height); ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(dx, dy, dw, dh);
    // Rule of thirds
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 0.5;
    [[1/3,0,1/3,1],[2/3,0,2/3,1],[0,1/3,1,1/3],[0,2/3,1,2/3]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(dx+dw*x1, dy+dh*y1); ctx.lineTo(dx+dw*x2, dy+dh*y2); ctx.stroke();
    });
    c._crop = { x: cropX, y: cropY, w: cw, h: ch, tw: px.w, th: px.h };
    $('idi2').textContent = px.w + '\xd7' + px.h + ' · ' + ($('idfmt').value.split('/')[1]||'JPEG').toUpperCase();
  };

  const idc = () => $('idCanvas');
  $('idCanvas').onmousedown = e => { dragging = true; _idDrag(e); e.preventDefault(); };
  $('idCanvas').onmousemove = e => { if (dragging) _idDrag(e); };
  $('idCanvas').onmouseleave = () => { dragging = false; };
  document.removeEventListener('mouseup', window._idMouseUp);
  window._idMouseUp = () => { dragging = false; };
  document.addEventListener('mouseup', window._idMouseUp);

  function _idDrag(e) {
    if (!src) return;
    const rect = idc().getBoundingClientRect();
    cx = (e.clientX - rect.left) / rect.width;
    cy = (e.clientY - rect.top) / rect.height;
    _idRender();
  }

  async function _idGetBlob() {
    const cr = idc()._crop; if (!cr) return null;
    const bg = $('idbg').value || '#ffffff';
    const c = document.createElement('canvas'); c.width = cr.tw; c.height = cr.th;
    const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, cr.tw, cr.th);
    ctx.drawImage(src.img, cr.x, cr.y, cr.w, cr.h, 0, 0, cr.tw, cr.th);
    return new Promise(r => c.toBlob(r, $('idfmt').value, 0.92));
  }

  window._idDownload = async () => {
    if (!src) return toast('请先上传照片');
    out = await _idGetBlob();
    $('idi2').textContent = $('idi2').textContent + ' · ' + fmtSize(out.size);
    saveToolSettings('t-idphoto');
    download(out, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '证件照', $('idfmt').value));
    toast('下载成功！', 'suc');
  };
  window._idQueue = async () => {
    if (!src) return toast('请先上传照片');
    saveToolSettings('t-idphoto');
    const blob = await _idGetBlob();
    BatchQueue.add(blob, makeFilename(Settings.getGlobal().filenamePattern, src.file.name, '证件照', $('idfmt').value), '证件照');
  };
}

      </div>

        <div class="prev" id="nfprev"><div class="pe">等待上传…</div></div>
        <div class="infog" id="nfinfo" style="display:none;padding:8px;flex-shrink:0"></div>
        <div style="font-size:10px;color:var(--tx3);text-align:center;padding:8px" id="nfhash">计算中…</div>

    const buf = await f.arrayBuffer();
    const hashHex = await crypto.subtle.digest('SHA-256', buf).then(h => [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''));

    const img = await loadImg(f);
    const exif = f.type === 'image/jpeg' ? parseExif(buf) : null;
    let dpi = '-', colorSpace = 'sRGB';
    if (exif) {
      const xRes = exif.ifd0?.[0x011A], yRes = exif.ifd0?.[0x011B], resUnit = exif.ifd0?.[0x0128];
      if (xRes && yRes) dpi = Math.round(xRes) + '×' + Math.round(yRes) + (resUnit === 3 ? ' DPI' : (resUnit === 2 ? ' DPCM' : ''));
      if (exif.ifd0?.[0xA001] === 2) colorSpace = 'Adobe RGB';
    }

    $('nfinfo').innerHTML = `
      <div class="info"><span class="il">文件名</span><span class="iv" style="word-break:break-all">${f.name}</span></div>
      <div class="info"><span class="il">大小</span><span class="iv">${fmtSize(f.size)}</span></div>
      <div class="info"><span class="il">格式</span><span class="iv">${f.type || '未知'}</span></div>
      <div class="info"><span class="il">尺寸</span><span class="iv">${img.img.width} × ${img.img.height} · ${(img.img.width*img.img.height/1e6).toFixed(2)} MP</span></div>
      <div class="info"><span class="il">宽高比</span><span class="iv">${(()=>{const g=(a,b)=>b?g(b,a%b):a;const d=g(img.img.width,img.img.height);return (img.img.width/d)+':'+(img.img.height/d);})()}</span></div>
      <div class="info"><span class="il">最后修改</span><span class="iv">${new Date(f.lastModified).toLocaleString()}</span></div>
      <div class="info"><span class="il">DPI</span><span class="iv">${dpi}</span></div>
      <div class="info"><span class="il">色彩空间</span><span class="iv">${colorSpace}</span></div>`;
    $('nfhash').innerHTML = 'SHA-256: <b style="font-family:monospace;word-break:break-all">' + hashHex + '</b>';

    $('nfdata').style.display = 'block';
    const rows = [];
    if (f.type === 'image/jpeg') rows.push(['📷', 'JPEG', '有损压缩格式，广泛兼容']);
    else if (f.type === 'image/png') rows.push(['📷', 'PNG', '无损压缩，支持透明通道']);
    else if (f.type === 'image/webp') rows.push(['📷', 'WebP', 'Google 现代格式，支持有损/无损/透明']);
    else if (f.type === 'image/avif') rows.push(['📷', 'AVIF', '新一代格式，高压缩率']);
    else if (f.type === 'image/bmp') rows.push(['📷', 'BMP', '无压缩位图']);
    if (exif?.ifd0?.[0x010F]) rows.push(['📱', '设备', exif.ifd0[0x010F] + (exif.ifd0[0x0110] ? ' ' + exif.ifd0[0x0110] : '')]);
    if (exif?.subifd?.[0x9003]) rows.push(['📅', '拍摄', exif.subifd[0x9003]]);
    if (exif?.subifd?.[0x8827]) rows.push(['⚙️', 'ISO', exif.subifd[0x8827]]);
    if (exif?.subifd?.[0x829A]) rows.push(['', '快门', (v => v < 1 ? '1/' + Math.round(1/v) + 's' : v.toFixed(1) + 's')(exif.subifd[0x829A])]);
    if (exif?.subifd?.[0x829D]) rows.push(['', '光圈', 'f/' + exif.subifd[0x829D]]);
    $('nfitems').innerHTML = rows.length
      ? rows.map(r => `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px"><span>${r[0]}</span><span style="color:var(--tx3);width:48px;flex-shrink:0;font-size:11px">${r[1]}</span><span>${r[2]}</span></div>`).join('')
      : '<div style="color:var(--tx3);text-align:center;padding:16px">无额外元数据</div>';
  });
}
